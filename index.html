<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simp. P2P - Host</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0f;--surface:#12121a;--surface2:#1a1a26;
  --border:rgba(255,255,255,0.07);--accent:#ff3c6e;
  --text:#f0f0f5;--muted:#6b6b80;--item:#16161f;--hh:58px;
}
body{background:var(--bg);color:var(--text);font-family:'Syne',sans-serif;min-height:100vh;overflow-x:hidden}
header{height:var(--hh);display:flex;align-items:center;justify-content:space-between;padding:0 1.5rem;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:200;background:rgba(10,10,15,.95)}
.logo{font-size:1.5rem;font-weight:800;letter-spacing:-.02em; display:flex; align-items:center; gap:10px;}
.logo span{color:var(--accent)}
.role-badge{font-size:0.6rem; padding:0.2rem 0.5rem; border-radius:10px; font-family:'Space Mono'; text-transform:uppercase; font-weight:bold; letter-spacing:1px; background:#333;}
.role-host{background:rgba(145,71,255,.2); color:#bf94ff; border:1px solid #bf94ff;}
.hright{display:flex;align-items:center;gap:.75rem}
.abtn{background:none;border:1px solid var(--border);color:var(--muted);padding:.3rem .85rem;border-radius:20px;font-family:'Space Mono',monospace;font-size:.7rem;cursor:pointer;transition:.2s}
.abtn:hover{border-color:var(--accent);color:var(--accent)}
.dropdown { position: relative; display: inline-block; }
.dropdown-content { display: none; position: absolute; right: 0; top: 120%; background-color: var(--surface); min-width: 280px; box-shadow: 0px 8px 20px rgba(0,0,0,0.8); z-index: 300; border: 1px solid var(--border); border-radius: 8px; max-height: 350px; overflow-y: auto; }
.dropdown-content.show { display: block; animation: fdIn 0.2s ease; }
@keyframes fdIn { from{opacity:0; transform:translateY(-10px)} to{opacity:1; transform:translateY(0)} }
.plist-item { padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.03); display: flex; align-items: center; gap: 10px; cursor: pointer; transition: .2s; }
.plist-item:hover { background-color: var(--surface2); }
.plist-thumb { width: 45px; height: 26px; border-radius: 4px; object-fit: cover; }
.plist-title { font-size: 0.75rem; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; color: var(--text); }
.plist-del { background: none; border: none; color: var(--muted); cursor: pointer; padding: 5px; font-size: 0.8rem; border-radius: 4px; }
.plist-del:hover { color: var(--accent); background: rgba(255,60,110,.1); }
.tp{display:flex;align-items:center;gap:.4rem;background:rgba(145,71,255,.12);border:1px solid rgba(145,71,255,.3);border-radius:20px;padding:.28rem .75rem;font-family:'Space Mono',monospace;font-size:.7rem;color:#bf94ff}
.tdot{width:6px;height:6px;border-radius:50%;background:#bf94ff;animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
main{display:grid;grid-template-columns:1fr 350px;min-height:calc(100vh - var(--hh))}
.theater{padding:1.5rem;border-right:1px solid var(--border);display:flex;flex-direction:column;gap:1rem}
.theater-stage{position:relative;width:100%}
.player-glow{position:absolute;inset:0;background-size:cover;background-position:center;filter:blur(50px) saturate(200%);opacity:0;transition:opacity 0.6s ease;z-index:0;pointer-events:none;border-radius:12px;transform:scale(1.05)}
.player-glow.active{opacity:0.25}
.player-wrap{background:#000;border-radius:12px;overflow:hidden;position:relative;aspect-ratio:16/9;border:1px solid var(--border);width:100%;z-index:2; display:flex; align-items:center; justify-content:center;}
#ytFrame{width:100%;height:100%;border:none;display:block}
#rawAudio { width: 90%; margin: auto; display: none; }
.eover{position:absolute;inset:0;background:rgba(10,10,15,.93);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.75rem;transition:opacity .3s;z-index:3}
.eover.gone{opacity:0; pointer-events:none;}
.eover .ei{font-size:2.5rem;opacity:.2}
.eover p{font-family:'Space Mono',monospace;font-size:.75rem;color:var(--muted);text-align:center;line-height:1.8}
.npbar{display:flex;align-items:center;gap:.75rem;position:relative;z-index:2}
.npi{flex:1;min-width:0}
.nplbl{font-family:'Space Mono',monospace;font-size:.6rem;color:var(--accent);letter-spacing:.18em;text-transform:uppercase;margin-bottom:.2rem}
.nptitle{font-size:1rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.npuser{font-family:'Space Mono',monospace;font-size:.7rem;color:var(--muted)}.npuser b{color:#bf94ff;font-weight:400}
.volrow{display:flex;align-items:center;gap:.5rem;flex:1;min-width:140px}
.volrow label{font-family:'Space Mono',monospace;font-size:.68rem;color:var(--muted)}
.volrow input[type=range]{flex:1;accent-color:var(--accent);cursor:pointer}
.volnum{font-family:'Space Mono',monospace;font-size:.68rem;min-width:30px;text-align:right}
.qside{display:flex;flex-direction:column;height:calc(100vh - var(--hh));position:sticky;top:var(--hh);overflow:hidden}
.qhead{padding:1rem 1.25rem .7rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.qtitle{font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.qcount{background:var(--accent);color:#fff;font-family:'Space Mono',monospace;font-size:.62rem;font-weight:700;padding:.12rem .45rem;border-radius:20px}
.user-add-box { display: flex; padding: 0.7rem 1.25rem; background: var(--surface); border-bottom: 1px solid var(--border); gap: 0.4rem; flex-shrink: 0; }
.user-add-box input { flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 0.5rem 0.65rem; color: var(--text); font-family: 'Space Mono', monospace; font-size: 0.7rem; outline: none; transition: .2s; }
.user-add-box input:focus { border-color: var(--accent); }
.user-add-box button { background: var(--accent); border: none; color: #fff; padding: 0.5rem 0.9rem; border-radius: 6px; font-weight: 700; cursor: pointer; transition: .2s; }
.user-add-box button:hover { background: #d42f5e; }
.qlist-wrap{flex:1;position:relative;display:flex;flex-direction:column;overflow:hidden;}
#qlistBg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0.1;z-index:0;pointer-events:none;transition:background-image 0.5s ease;}
.qlist{flex:1;overflow-y:auto;padding:.7rem;display:flex;flex-direction:column;gap:.45rem;position:relative;z-index:1}
.qlist::-webkit-scrollbar{width:3px}
.qlist::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.qi{background:#000;border:1px solid var(--border);border-radius:8px;padding:.6rem .7rem;display:flex;align-items:center;gap:.65rem;transition:border-color .2s;animation:qs .25s ease;position:relative;z-index:1}
@keyframes qs{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.qi:hover{border-color:rgba(255,255,255,.12)}
.qi.cur{border-color:var(--accent);}
.qithumb{width:68px;height:40px;border-radius:5px;background:var(--surface2);overflow:hidden;flex-shrink:0;position:relative}
.qithumb img{width:100%;height:100%;object-fit:cover;display:block}
.qibody{flex:1;min-width:0}
.qititle{font-size:.78rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.qiuser{font-family:'Space Mono',monospace;font-size:.62rem;color:#bf94ff;margin-top:.1rem}
.qinum{font-family:'Space Mono',monospace;font-size:.68rem;color:var(--muted);flex-shrink:0}
.qidel{background:none;border:none;color:var(--muted);cursor:pointer;font-size:.75rem;padding:.15rem .3rem;border-radius:4px;transition:.2s;flex-shrink:0;display:none}
.qi:hover .qidel{display:flex}
.qidel:hover{color:var(--accent);background:rgba(255,60,110,.1)}
.qempty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5rem;color:var(--muted);text-align:center;padding:2rem}
.qempty .qei{font-size:2rem;opacity:.2}
.qempty p{font-family:'Space Mono',monospace;font-size:.7rem;line-height:1.8}
.chatbox{border-top:1px solid var(--border);padding:.7rem 1rem;max-height:130px;overflow-y:auto;background:var(--surface);flex-shrink:0}
.chatbox::-webkit-scrollbar{width:3px}.chatbox::-webkit-scrollbar-thumb{background:var(--border)}
.cblbl{font-family:'Space Mono',monospace;font-size:.58rem;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:.4rem}
.cm{font-family:'Space Mono',monospace;font-size:.66rem;line-height:1.6;padding:.1rem 0;border-bottom:1px solid rgba(255,255,255,.025);animation:fdin .2s ease}
@keyframes fdin{from{opacity:0}to{opacity:1}}
.cmu{color:#bf94ff;font-weight:700}.cmt{color:var(--muted)}
.toasts{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:.4rem;align-items:center;pointer-events:none}
.toast{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:.5rem 1.1rem;font-family:'Space Mono',monospace;font-size:.72rem;color:var(--text);white-space:nowrap;animation:tin .3s ease,tout .3s ease 2.4s forwards}
.toast.ok{border-color:rgba(50,200,100,.4);color:#5de89a}
.toast.err{border-color:rgba(255,60,60,.4);color:#ff7070}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes tout{to{opacity:0}}

@media(max-width:760px){main{grid-template-columns:1fr}.qside{height:auto;position:static;max-height:420px}}
body::after{content:'';position:fixed;inset:0;opacity:.02;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");pointer-events:none;z-index:9998}
</style>
</head>
<body>

<header>
  <div class="logo">Simp<span>.</span> <span id="roleBadge" class="role-badge role-host">👑 HOST</span></div>
  <div class="hright">
    <div class="dropdown">
      <button class="abtn" id="dropBtn">📑 Playlist</button>
      <div class="dropdown-content" id="dropContent"></div>
    </div>
    <div class="tp" id="statusTag"><div class="tdot"></div>Online</div>
  </div>
</header>
<main>
  <div class="theater">
    <div class="theater-stage">
      <div id="playerGlow" class="player-glow"></div>
      <div class="player-wrap">
        <div id="ytFrame"></div>
        <audio id="rawAudio" controls style="display:none; width: 90%; z-index: 5; margin: 10px;"></audio>
        <div class="eover" id="eover">
          <div class="ei">🎬</div>
          <p id="eoverText">Host iniciado.<br>Aguardando vídeos!</p>
        </div>
      </div>
    </div>
    <div class="npbar" id="npbar" style="display:none">
      <div class="npi">
        <div class="nplbl">▶ tocando agora</div>
        <div class="nptitle" id="npTitle">—</div>
        <div class="npuser">pedido por <b id="npUser">—</b></div>
      </div>
    </div>
    <div style="display:flex;gap:1rem;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1rem 1.25rem;margin:1rem 0;position:relative;z-index:2">
      <div class="volrow" style="flex:1">
        <label>VOL</label>
        <input type="range" min="0" max="100" value="80" id="volSlider">
        <span class="volnum" id="volNum">80%</span>
      </div>
    </div>
  </div>
  <div class="qside">
    <div class="qhead">
      <span class="qtitle">Fila de vídeos</span>
      <span class="qcount" id="qcount">0</span>
    </div>
    <div class="user-add-box">
      <input type="text" id="userUrl" placeholder="Link YouTube, Áudio ou Pesquisa..." autocomplete="off">
      <button id="userAddBtn">Add</button>
    </div>
    <div class="qlist-wrap">
      <div id="qlistBg"></div>
      <div class="qlist" id="qlist">
        <div class="qempty" id="qempty">
          <div class="qei">📺</div>
          <p>Fila vazia!</p>
        </div>
      </div>
    </div>
    <div class="chatbox" id="chatbox">
      <div class="cblbl">Chat da Sala</div>
    </div>
  </div>
</main>

<div class="toasts" id="toasts"></div>

<script>
// ==========================================
// CONFIGURAÇÕES DO HOST
// ==========================================
const ROOM_ID = 'simp-room-host';
const ADMIN_USERS = ['aceboladoo_', 'bbeazinhaa', 'daenilajudante', 'daniloamorimking', 'gmoninho', 'nightbot', 'omonfredini', 'popolea', 'roninlinguica', 'saimo504'];

let queue = [];
let curIdx = -1;
let isHost = true;
let paused = false;
let ytReady = false;
let ytPlayer = null;
let currentGifUrl = '';
let myPlaylist = JSON.parse(localStorage.getItem('simpPlaylist') || '[]');
let myName = localStorage.getItem('simpUserName') || 'Anônimo';
let config = JSON.parse(localStorage.getItem('simpConfig') || '{}');
if(!config.gifWords) config = { gifWords: 3, glow: true, vol: 80, autoSkip: true, maxDuration: 5 };
let simpsPoints = JSON.parse(localStorage.getItem('simpPoints') || '{}');
let twitchColors = JSON.parse(localStorage.getItem('simpTwitchColors') || '{}');

// ==========================================
// SISTEMA DE NOME DO USUÁRIO
// ==========================================
function askUserName() {
    const name = prompt('Digite seu nome de usuário para o chat:', myName);
    if(name && name.trim()) {
        myName = name.trim().substring(0, 20);
        localStorage.setItem('simpUserName', myName);
        document.getElementById('statusTag').innerHTML = `<div class="tdot"></div>${myName}`;
    }
    return myName;
}

if(myName === 'Anônimo') askUserName();
document.getElementById('statusTag').innerHTML = `<div class="tdot"></div>${myName}`;
document.getElementById('statusTag').addEventListener('click', askUserName);

// ==========================================
// LÓGICA DO PLAYER
// ==========================================

function initConfigUI() {
  document.getElementById('cfgGlow') && (document.getElementById('cfgGlow').checked = config.glow);
  document.getElementById('volSlider').value = config.vol;
  document.getElementById('volNum').textContent = config.vol + '%';
  const rawAudio = document.getElementById('rawAudio');
  if(rawAudio) rawAudio.volume = config.vol / 100;
}
function saveConfig() { localStorage.setItem('simpConfig', JSON.stringify(config)); }

function cleanTitleForGif(title) { return title.toLowerCase().replace(/[^a-z0-9\s]/g, ' ').replace(/\s+/g, ' ').trim().split(' ').slice(0, config.gifWords).join(' '); }
function getUserPoints(user) { return simpsPoints[user] || 0; }
function addPoints(user, amount) {
  if(!user) return;
  simpsPoints[user] = (simpsPoints[user] || 0) + amount;
  localStorage.setItem('simpPoints', JSON.stringify(simpsPoints));
}
function spendPoints(user, amount) {
  if(!user || getUserPoints(user) < amount) return false;
  simpsPoints[user] -= amount;
  localStorage.setItem('simpPoints', JSON.stringify(simpsPoints));
  return true;
}

async function searchYouTube(query) {
  try {
    const response = await fetch(`https://inv.nadeko.net/api/v1/search?q=${encodeURIComponent(query)}&type=video`);
    if (!response.ok) throw new Error('Busca falhou');
    const data = await response.json();
    if (!data || !Array.isArray(data) || data.length === 0) return null;
    return { videoId: data[0].videoId, title: data[0].title };
  } catch(e) {
    try {
      const response2 = await fetch(`https://invidious.nerdvpn.de/api/v1/search?q=${encodeURIComponent(query)}&type=video`);
      if (!response2.ok) throw new Error('Fallback falhou');
      const data2 = await response2.json();
      if (!data2 || !Array.isArray(data2) || data2.length === 0) return null;
      return { videoId: data2[0].videoId, title: data2[0].title };
    } catch(e2) { return null; }
  }
}

async function getVideoDuration(id) {
  if(id.match(/\.(mp3|wav|ogg|flac)$/i)) return 0;
  try{
    const r = await fetch(`https://inv.nadeko.net/api/v1/videos/${id}`);
    if(!r.ok) throw new Error('Falha ao buscar duração');
    const d = await r.json();
    return d.lengthSeconds || 0;
  }catch(e){ return 0; }
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function playPing() {
  try{ 
    const audioCtx = new (window.AudioContext||window.webkitAudioContext)(); 
    const osc = audioCtx.createOscillator(); 
    const gain = audioCtx.createGain(); 
    osc.connect(gain); 
    gain.connect(audioCtx.destination); 
    osc.frequency.setValueAtTime(800,audioCtx.currentTime); 
    gain.gain.setValueAtTime(0.1,audioCtx.currentTime); 
    osc.start(); 
    osc.stop(audioCtx.currentTime+0.1); 
  }catch(e){}
}

async function addToQueue(rawUrl, user, color) {
  if(!user) user = myName;
  let id = extractId(rawUrl);
  if (!id) {
     if (rawUrl.match(/\.(mp3|wav|ogg|flac)$/i)) { id = rawUrl; } 
     else {
         logChat('SISTEMA', `🔍 Buscando: "${rawUrl}"...`, true);
         const result = await searchYouTube(rawUrl);
         if (result) { id = result.videoId; } 
         else { toast('❌ Nada encontrado / Link inválido', 'err'); return; }
     }
  }

  if (queue.find(q => q.videoId === id)) { toast('Já na fila!', 'err'); return; }
  const title = await fetchTitle(id); 
  const duration = await getVideoDuration(id);
  if(duration > 0 && duration > config.maxDuration * 60) { toast(`❌ >${config.maxDuration}min`, 'err'); return; }
  
  if(color && color.startsWith('#')) { twitchColors[user] = color; localStorage.setItem('simpTwitchColors', JSON.stringify(twitchColors)); }
  
  const userColor = twitchColors[user] || null;
  const isAudio = id.match(/\.(mp3|wav|ogg|flac)$/i);
  const thumb = isAudio ? 'https://files.catbox.moe/tq0gqz.png' : `https://img.youtube.com/vi/${id}/hqdefault.jpg`;
  
  queue.push({videoId:id, title, user, color: userColor, thumb});
  addPoints(user, 10);
  logChat(user, rawUrl, true, userColor || '#bf94ff');
  // playPing();
  toast(`✅ Adicionado`, 'ok');
  if (curIdx === -1) startPlayback(0); else renderQueue();
}

function extractId(url) {
  url = String(url).trim(); if(url.match(/\.(mp3|wav|ogg|flac)$/i)) return url; 
  let m = url.match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([a-zA-Z0-9_-]{11})/);
  if (m) return m[1]; if (/^[a-zA-Z0-9_-]{11}$/.test(url)) return url; return null;
}

async function fetchTitle(id) {
  if(id.match(/\.(mp3|wav|ogg|flac)$/i)) { let parts = id.split('/'); return decodeURIComponent(parts[parts.length-1]) || 'Áudio Adicionado'; }
  try { const r = await fetch(`https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${id}&format=json`); const d = await r.json(); return d.title || 'Vídeo do YouTube'; } catch { return 'Vídeo do YouTube'; }
}

async function setQueueGif(title) {
  const clean = cleanTitleForGif(title || 'anime');
  try { 
    const r = await fetch(`https://g.tenor.com/v1/search?q=${encodeURIComponent(clean)}&key=LIVDSRZULELA&limit=1&media_filter=minimal`); 
    const d = await r.json(); 
    currentGifUrl = d.results && d.results.length ? d.results[0].media[0].gif.url : ''; 
  } catch(e) { currentGifUrl = ''; }
  document.getElementById('qlistBg').style.backgroundImage = currentGifUrl ? `url(${currentGifUrl})` : '';
}

function startPlayback(idx) {
  if (idx < 0 || idx >= queue.length) return;
  curIdx = idx; 
  const item = queue[curIdx];
  document.getElementById('eover').classList.add('gone');
  document.getElementById('npbar').style.display = 'flex';
  document.getElementById('npTitle').textContent = item.title;
  document.getElementById('npUser').textContent = item.user;
  document.getElementById('npUser').style.color = item.color || '';
  document.getElementById('playerGlow').style.backgroundImage = `url(${item.thumb})`;
  if(config.glow) document.getElementById('playerGlow').classList.add('active');
  loadVid(item.videoId);
  setQueueGif(item.title);
  renderQueue();
}

function nextVideo() {
  queue.splice(0, curIdx + 1);
  curIdx = -1;
  if (queue.length > 0) startPlayback(0);
  else showEmpty();
}

function showEmpty() {
  curIdx = -1;
  currentGifUrl = '';
  document.getElementById('eover').classList.remove('gone');
  document.getElementById('eoverText').innerHTML = "Nenhum vídeo.<br>Use o campo acima para adicionar!";
  document.getElementById('npbar').style.display = 'none';
  document.getElementById('playerGlow').classList.remove('active');
  if (ytReady && ytPlayer) ytPlayer.stopVideo();
  document.getElementById('rawAudio').pause();
  document.getElementById('rawAudio').style.display = 'none';
  document.getElementById('qlistBg').style.backgroundImage = '';
  renderQueue();
}

function loadVid(id) {
  if(!id) return;
  const isAudio = id.match(/\.(mp3|wav|ogg|flac)$/i);
  const rawAudio = document.getElementById('rawAudio');
  const ytFrame = document.getElementById('ytFrame');
  
  if(isAudio) {
      ytFrame.style.display = 'none';
      if(ytPlayer && ytReady) ytPlayer.stopVideo();
      rawAudio.style.display = 'block';
      rawAudio.src = id;
      rawAudio.volume = config.vol / 100;
      if(!paused) rawAudio.play();
  } else {
      rawAudio.style.display = 'none';
      rawAudio.pause();
      ytFrame.style.display = 'block';
      if(ytReady && ytPlayer) {
          ytPlayer.loadVideoById({videoId:id, startSeconds:0});
          if(!paused) ytPlayer.playVideo();
      }
  }
}

function renderQueue() {
  const list = document.getElementById('qlist');
  const empty = document.getElementById('qempty');
  document.getElementById('qcount').textContent = queue.length;
  list.querySelectorAll('.qi').forEach(i=>i.remove());
  
  if(queue.length===0){ empty.style.display='flex'; return; }
  empty.style.display='none';
  
  queue.forEach((item,i)=>{
    const isCur = i===curIdx;
    let pos = isCur ? '▶' : (curIdx>=0 ? '#'+(i-curIdx) : '#'+(i+1));
    const d = document.createElement('div');
    d.className = 'qi' + (isCur?' cur':'');
    d.innerHTML = `
      <div class="qithumb"><img src="${esc(item.thumb)}" loading="lazy"></div>
      <div class="qibody"><div class="qititle" title="${esc(item.title)}">${esc(item.title)}</div><div class="qiuser" style="${item.color ? `color:${item.color}` : ''}">${esc(item.user)}</div></div>
      ${!isCur ? `<span class="qinum">${pos}</span>` : ''}
      <button class="qidel" data-i="${i}" title="Remover">✕</button>
    `;
    list.appendChild(d);
  });
  
  list.querySelectorAll('.qidel').forEach(btn=>{
    btn.addEventListener('click',e=>{
      e.stopPropagation();
      const i=parseInt(btn.dataset.i);
      queue.splice(i,1);
      if(i<curIdx) curIdx--;
      else if(i===curIdx){
        curIdx=-1;
        if(queue.length>0) startPlayback(0);
        else showEmpty();
      }
      renderQueue();
    });
  });
}

function renderPlaylist() {
  const c = document.getElementById('dropContent');
  c.innerHTML = '';
  if(myPlaylist.length===0){ 
    c.innerHTML = '<div style="padding:15px;font-size:0.75rem;color:var(--muted);text-align:center;">Playlist vazia</div>'; 
    return; 
  }
  myPlaylist.forEach((item,i)=>{
    const d = document.createElement('div');
    d.className='plist-item';
    d.innerHTML = `<img class="plist-thumb" src="${esc(item.thumb)}" loading="lazy"><div class="plist-title">${esc(item.title)}</div><button class="plist-del" data-i="${i}">✕</button>`;
    d.addEventListener('click',e=>{ 
      if(e.target.classList.contains('plist-del'))return;
      addToQueue(item.videoId.match(/\.(mp3|wav|ogg|flac)$/i) ? item.videoId : `https://youtu.be/${item.videoId}`, myName, null);
      document.getElementById('dropContent').classList.remove('show');
    });
    c.appendChild(d);
  });
  c.querySelectorAll('.plist-del').forEach(btn=>{
    btn.addEventListener('click',e=>{
      e.stopPropagation();
      myPlaylist.splice(parseInt(btn.dataset.i),1);
      localStorage.setItem('simpPlaylist',JSON.stringify(myPlaylist));
      renderPlaylist();
    });
  });
}

// YouTube API
(function(){ const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(s); })();
window.onYouTubeIframeAPIReady = function(){
  ytPlayer = new YT.Player('ytFrame', {
    playerVars: { 'controls': 0, 'disablekb': 1 },
    events: {
      onReady: function(e) { 
          ytReady = true; 
          e.target.setVolume(config.vol);
          initConfigUI();
      },
      onStateChange: function(e) {
        if(e.data === YT.PlayerState.PLAYING) {
           const dur = ytPlayer.getDuration ? ytPlayer.getDuration() : 0;
           if(dur > config.maxDuration * 60) { 
               logChat('SISTEMA', `⏭️ Pulando vídeo muito longo (> ${config.maxDuration} min).`, true);
               nextVideo(); 
               return;
           }
        }
        if(e.data === YT.PlayerState.ENDED) { 
          if(config.autoSkip) nextVideo(); 
        }
        paused = (e.data === YT.PlayerState.PAUSED);
      }
    }
  });
};

document.getElementById('rawAudio').onended = () => { if(config.autoSkip) nextVideo(); };
document.getElementById('rawAudio').addEventListener('loadedmetadata', function() { 
  if(this.duration > config.maxDuration * 60) { 
      logChat('SISTEMA', `⏭️ Pulando áudio muito longo (> ${config.maxDuration} min).`, true);
      nextVideo(); 
  } 
});

function logChat(user, text, isSystem=false, color='#bf94ff') {
  const box = document.getElementById('chatbox');
  const points = getUserPoints(user);
  const d = document.createElement('div');
  d.className = 'cm';
  if(isSystem) {
      d.innerHTML = `<span class="cmu" style="color:var(--accent)">[SISTEMA]</span>: <span class="cmt">${esc(text)}</span>`;
  } else {
      d.innerHTML = `<span class="cmu" style="color:${color}">${esc(user)} <span style="color:#ff3c6e">(${points} Simps)</span></span>: <span class="cmt">${esc(text)}</span>`;
  }
  box.appendChild(d);
  if(box.childNodes.length>50) box.firstChild.remove();
  box.scrollTop = box.scrollHeight;
}

function toast(msg, type='') {
  const c = document.getElementById('toasts');
  const t = document.createElement('div');
  t.className='toast '+type;
  t.textContent=msg;
  c.appendChild(t);
  setTimeout(()=>t.remove(),3000);
}

// ==========================================
// CONEXÃO COM O CHAT (Twitch IRC)
// ==========================================
const CHANNEL = 'daenil';
const CMD = '%simp';

function connectTwitch() {
  const ws = new WebSocket('wss://irc-ws.chat.twitch.tv:443');
  const rnd = Math.floor(Math.random()*99999);
  
  ws.onopen = () => { 
    ws.send(`PASS oauth:justinfan${rnd}`); 
    ws.send(`NICK justinfan${rnd}`); 
    ws.send(`JOIN #${CHANNEL}`); 
    ws.send('CAP REQ :twitch.tv/tags');
    logChat('SISTEMA', `Conectado ao chat da Twitch: #${CHANNEL}`, true);
  };
  
  ws.onmessage = async (e) => {
    const raw = e.data.trim();
    if(raw.startsWith('PING')){ ws.send('PONG :tmi.twitch.tv'); return; }
    
    let tags = {};
    let messagePart = raw;
    if(raw.startsWith('@')) {
      const tagEnd = raw.indexOf(' ');
      const tagStr = raw.substring(1, tagEnd);
      tagStr.split(';').forEach(t => { const [k,v] = t.split('='); tags[k] = v || ''; });
      messagePart = raw.substring(tagEnd+1);
    }
    
    const m = messagePart.match(/:(\w+)!\w+@\w+\.tmi\.twitch\.tv PRIVMSG #\w+ :(.*)/);
    if(!m) return;
    
    const twitchUser = m[1].toLowerCase();
    const msg = m[2].trim();
    const rawColor = tags.color && tags.color.startsWith('#') ? tags.color : null;
    const color = rawColor || '#bf94ff';
    const isMod = tags.mod === '1' || (tags.badges && tags.badges.includes('moderator'));
    
    if(rawColor) { 
      twitchColors[twitchUser] = rawColor; 
      localStorage.setItem('simpTwitchColors', JSON.stringify(twitchColors));
    }
    
    logChat(twitchUser, msg, false, color);
    
    if(msg.toLowerCase().startsWith(CMD.toLowerCase()+' ') || msg.toLowerCase() === CMD.toLowerCase()){
      const parts = msg.slice(CMD.length).trim().split(' ');
      const action = parts[0].toLowerCase();
      
      if(action === 'skip' || msg.toLowerCase() === CMD.toLowerCase()){
        if(isMod || getUserPoints(twitchUser) >= 50){
          if(!isMod) spendPoints(twitchUser, 50);
          nextVideo();
          logChat('SISTEMA', `${twitchUser} pulou o vídeo!`, true);
        } else {
          logChat('SISTEMA', `${twitchUser} não tem Simps suficientes para pular (precisa de 50)`, true);
        }
        return;
      }
      
      if(action === 'trocar' && getUserPoints(twitchUser) >= 50){
        spendPoints(twitchUser, 50);
        queue = queue.sort(() => Math.random() - 0.5);
        renderQueue();
        logChat('SISTEMA', `${twitchUser} embaralhou a fila! (-50 Simps)`, true);
        return;
      }
      
      if(action === 'gif' && parts.length > 1){
        const gifName = parts.slice(1).join(' ');
        if(getUserPoints(twitchUser) >= 20){
          spendPoints(twitchUser, 20);
          setQueueGif(gifName);
          logChat('SISTEMA', `${twitchUser} alterou o GIF de fundo para "${gifName}" (-20 Simps)`, true);
        } else {
          logChat('SISTEMA', `${twitchUser} não tem Simps suficientes para GIF (precisa de 20)`, true);
        }
        return;
      }
      
      await addToQueue(msg.slice(CMD.length).trim(), twitchUser, color);
    }
  };
  
  ws.onclose = () => setTimeout(connectTwitch, 5000);
  ws.onerror = () => setTimeout(connectTwitch, 5000);
}

connectTwitch();

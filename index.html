<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Os Jogos Famintos — Simulador Ultra Dinâmico</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0b0b0f; --sur: #13131a; --sur2: #1b1b26; --bdr: #262636;
  --red: #d90429; --gold: #ffb703; --txt: #e2e8f0; --txt2: #94a3b8; --wht: #ffffff;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg); color: var(--txt); font-family: 'Montserrat', sans-serif; min-height: 100vh; font-size: 1.05rem; }

/* HEADER */
.hdr { border-bottom: 2px solid var(--bdr); padding: 40px 20px; text-align: center; background: linear-gradient(180deg, #161622, var(--bg)); }
.hdr h1 { font-family: 'Cinzel', serif; font-size: 3.2rem; font-weight: 900; letter-spacing: .15em; color: var(--gold); text-shadow: 0 4px 10px rgba(0,0,0,0.5); }
.hdr p { font-size: 1rem; letter-spacing: .3em; color: var(--txt2); text-transform: uppercase; margin-top: 10px; }

.wrap { max-width: 1100px; margin: 0 auto; padding: 40px 20px; }
.sec-title { font-family: 'Cinzel', serif; font-size: 1.4rem; letter-spacing: .2em; text-transform: uppercase; color: var(--gold); text-align: center; margin-bottom: 40px; }

/* REAPING */
.dgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(450px, 1fr)); gap: 24px; }
.dcard { background: var(--sur); border: 2px solid var(--bdr); border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
.dhdr { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--bdr); padding-bottom: 12px; }
.dlbl { font-family: 'Cinzel', serif; font-size: 1.2rem; font-weight: 700; color: var(--wht); }
.clr-picker { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; color: var(--txt2); }
.clr-picker input { border: none; background: none; width: 30px; height: 30px; cursor: pointer; }
.trow { display: flex; gap: 16px; }
.tcard { flex: 1; background: var(--sur2); border: 2px solid transparent; border-radius: 8px; padding: 16px; cursor: pointer; text-align: center; transition: all .2s; position: relative; }
.tcard:hover { border-color: var(--gold); transform: translateY(-2px); }

.tpw { width: 85px; height: 85px; margin: 0 auto 12px; padding: 4px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
.tph, .tphd { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; }
.tphd { background: var(--bg); display: flex; align-items: center; justify-content: center; font-family: 'Cinzel', serif; font-size: 2rem; color: var(--txt2); border: 2px solid var(--bdr); }
.tnm { font-size: 1.1rem; font-weight: 600; color: var(--wht); margin-bottom: 12px; }

/* STATS BARS */
.sbars { display: flex; flex-direction: column; gap: 6px; }
.srow { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; }
.slbl { width: 65px; text-transform: uppercase; color: var(--txt2); text-align: left; }
.strk { flex: 1; height: 6px; background: var(--bg); border-radius: 3px; overflow: hidden; }
.sfil { height: 100%; border-radius: 3px; }
.sfil.hp { background: #2ecc71; } .sfil.c { background: #e67e22; } .sfil.i { background: #3498db; } .sfil.s { background: #e74c3c; }

/* HOVER TOOLTIP */
.tcard:hover .thover-box, .ev-pcard:hover .thover-box { display: block !important; opacity: 1; }
.thover-box { display: none; position: absolute; bottom: 105%; left: 50%; transform: translateX(-50%); background: #050508; border: 2px solid var(--gold); padding: 14px; border-radius: 8px; width: 260px; z-index: 999; text-align: left; box-shadow: 0 10px 20px rgba(0,0,0,0.8); pointer-events: none; }
.thover-box p { font-size: 0.85rem; margin-bottom: 4px; color: var(--txt2); line-height: 1.4; }
.thover-box strong { color: var(--wht); font-size: 0.95rem; }
.thover-box .inv-lbl { border-top: 1px solid var(--bdr); margin-top: 6px; padding-top: 6px; color: var(--gold); font-weight: bold; }
.thover-box .spec-lbl { color: #9d4edd; font-style: italic; }

/* MODAL EDIT */
.mbg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 200; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
.mbg.on { display: flex; }
.modal { background: var(--sur); border: 2px solid var(--bdr); border-radius: 16px; padding: 32px; width: 420px; max-width: 90vw; }
.mtitle { font-family: 'Cinzel', serif; font-size: 1.4rem; color: var(--gold); margin-bottom: 20px; text-align: center; }
.modal label { display: block; font-size: 0.9rem; color: var(--txt2); text-transform: uppercase; margin: 14px 0 4px; }
.modal input[type=text] { width: 100%; background: var(--bg); border: 2px solid var(--bdr); border-radius: 6px; color: var(--wht); font-size: 1.1rem; padding: 10px; outline: none; }
.modal input[type=range] { width: 100%; accent-color: var(--gold); cursor: pointer; display: block; height: 10px; }
.rval { float: right; color: var(--gold); font-weight: bold; }
.parea { border: 2px dashed var(--bdr); border-radius: 8px; padding: 16px; text-align: center; cursor: pointer; margin-top: 8px; }
.parea img { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; margin: 0 auto 10px; display: block; }
.mbtns { display: flex; gap: 12px; margin-top: 24px; }
.btn { font-size: 1rem; font-weight: 600; padding: 12px 20px; border: none; border-radius: 6px; cursor: pointer; flex: 1; text-transform: uppercase; }
.btnp { background: var(--red); color: var(--wht); } .btnp:hover { background: #ff4d5a; }
.btns { background: var(--bdr); color: var(--txt); }

/* ARENA */
#s-sim { display: none; }
.simhdr h2 { font-family: 'Cinzel', serif; font-size: 2.4rem; color: var(--wht); text-align: center; margin-bottom: 12px; }
.alivebar { text-align: center; font-size: 1.2rem; color: var(--txt2); margin-bottom: 40px; }
.alivebar strong { color: var(--gold); }

.dayblock { animation: fi 0.4s ease-out; }
@keyframes fi { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: none; } }
.dayhdr { display: flex; align-items: center; gap: 20px; margin: 40px 0 20px; }
.daynum { font-family: 'Cinzel', serif; font-size: 1.6rem; font-weight: 900; color: var(--red); white-space: nowrap; }
.daysep { flex: 1; height: 2px; background: var(--bdr); }
.dayevtname { font-family: 'Cinzel', serif; font-size: 1.2rem; color: var(--gold); letter-spacing: 0.1em; }

/* EVENTO DE DIA GLOBAL */
.gevt { background: var(--sur); border-left: 4px solid var(--gold); border-radius: 0 8px 8px 0; padding: 20px; font-style: italic; color: var(--txt2); line-height: 1.6; margin-bottom: 30px; font-size: 1.2rem; position: relative; }
.gevt .gstatus { position: absolute; right: 15px; top: 15px; background: rgba(255,183,3,0.15); color: var(--gold); font-size: 0.8rem; padding: 4px 8px; border-radius: 4px; font-weight: bold; text-transform: uppercase; }

/* LISTA DE EVENTOS INDIVIDUAIS */
.evitem { background: var(--sur); border: 2px solid var(--bdr); border-radius: 12px; padding: 24px; margin-bottom: 20px; display: flex; flex-direction: column; gap: 16px; position: relative; }
.evitem.eddeath { border-color: var(--red); background: linear-gradient(135deg, var(--sur), #251215); }
.evitem.edbad { border-color: #5c3d1d; }
.evitem.edcrisis { border-color: #7b2cbf; background: linear-gradient(135deg, var(--sur), #210036); }
.evitem.edescape { border-color: #00b4d8; background: linear-gradient(135deg, var(--sur), #002030); }

.ev-pics { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; border-bottom: 1px solid var(--bdr); padding-bottom: 16px; }
.ev-pcard { text-align: center; width: 100px; position: relative; cursor: help; }
.ev-pw { width: 76px; height: 76px; margin: 0 auto 6px; padding: 4px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: all 0.3s; }
.ev-pcard img, .ev-pcard .tphd { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; }
.ev-pcard .pname { font-size: 0.85rem; font-weight: 600; color: var(--wht); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.evtxt { line-height: 1.6; font-size: 1.25rem; text-align: center; padding: 0 10px; }

/* PULSE CRISIS GLOW */
.glow-crisis { box-shadow: 0 0 15px #9d4edd, 0 0 25px #7b2cbf; animation: pulseGlow 1.2s infinite alternate; }
@keyframes pulseGlow { from { transform: scale(1); filter: brightness(1); } to { transform: scale(1); filter: brightness(1); } }

/* ESCAPE GLOW */
.glow-escape { box-shadow: 0 0 15px #00b4d8, 0 0 25px #0077b6; }

/* STAT MAX FLASH */
.glow-statmax { box-shadow: 0 0 20px #ffb703, 0 0 35px #fb8500; animation: maxGlow 0.8s ease-in-out 3; }
@keyframes maxGlow { 0%,100% { filter: brightness(1); } 50% { filter: brightness(1.5); } }

.v-status { color: var(--gold); font-weight: bold; background: rgba(255,183,3,0.15); padding: 2px 8px; border-radius: 4px; font-size: 1.05rem; display: inline-block; margin-left: 6px; }
.v-status.escape-st { color: #00b4d8; background: rgba(0,180,216,0.15); }
.v-status.crisis-st { color: #c77dff; background: rgba(157,78,221,0.15); }

.startwrap, .nextwrap { text-align: center; margin-top: 40px; }
.btnstart, .btnnext, .btnrestart { font-family: 'Cinzel', serif; font-size: 1.2rem; font-weight: 700; letter-spacing: 0.1em; padding: 18px 48px; border: none; border-radius: 8px; cursor: pointer; transition: all 0.2s; }
.btnstart { background: var(--red); color: var(--wht); } .btnstart:hover { background: #ff4d5a; transform: scale(1.05); }
.btnnext { background: var(--sur); color: var(--gold); border: 2px solid var(--gold); } .btnnext:hover { background: var(--gold); color: var(--bg); }
.btnrestart { background: transparent; color: var(--txt2); border: 2px solid var(--bdr); margin-top: 30px; } .btnrestart:hover { border-color: var(--gold); color: var(--gold); }

/* MEMORIAM */
.memoriam { background: #0f0f14; border: 2px dashed var(--red); border-radius: 12px; padding: 30px; margin: 40px 0; text-align: center; }
.memgrid { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-top: 20px; }
.mementry { text-align: center; width: 90px; }
.mementry .mphi-w { width: 68px; height: 68px; margin: 0 auto 6px; padding: 3px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
.mementry img, .mementry .memphi { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; }
.mementry .memphi { background: var(--bg); display: flex; align-items: center; justify-content: center; font-family: 'Cinzel', serif; font-size: 1.5rem; color: var(--txt2); border: 1px solid var(--bdr); }
.memname { font-size: 0.9rem; color: var(--txt2); text-overflow: ellipsis; overflow: hidden; white-space: nowrap; }
.memday { font-size: 0.75rem; color: var(--red); font-weight: bold; text-transform: uppercase; margin-top: 2px; }

.dbar { background: rgba(230, 57, 70, 0.15); border: 2px solid var(--red); border-radius: 8px; padding: 16px; text-align: center; margin-top: 20px; font-size: 1.2rem; font-weight: 600; color: var(--wht); }
.victorblock { text-align: center; background: var(--sur); border: 3px solid var(--gold); border-radius: 16px; padding: 60px 20px; }
.victor-w { width: 148px; height: 148px; margin: 0 auto 20px; padding: 4px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
.victorphoto, .victorphi { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; }
.victorphi { background: var(--bg); display: flex; align-items: center; justify-content: center; font-family: 'Cinzel', serif; font-size: 4rem; color: var(--gold); border: 2px solid var(--bdr); }
.victorname { font-family: 'Cinzel', serif; font-size: 2.8rem; color: var(--gold); font-weight: 900; }
.victordist { font-size: 1.2rem; color: var(--txt2); margin-top: 8px; text-transform: uppercase; letter-spacing: 0.1em; }
.victorquote { font-style: italic; color: var(--txt2); margin-top: 24px; font-size: 1.3rem; line-height: 1.6; }

/* ESCAPED TRIBUTES */
.escapedblock { background: #050f14; border: 2px solid #00b4d8; border-radius: 12px; padding: 24px; margin: 20px 0; text-align: center; }
.escapedblock h3 { font-family: 'Cinzel', serif; color: #00b4d8; margin-bottom: 12px; font-size: 1.2rem; }

@media(max-width: 768px) { .dgrid { grid-template-columns: 1fr; } .trow { flex-direction: column; } }
</style>
</head>
<body>

<header class="hdr">
  <h1>Os Jogos Famintos</h1>
  <p>Simulador Oficial — Edição Brasileira</p>
</header>

<div id="s-reaping">
  <div class="wrap">
    <p class="sec-title">Tributos & Atributos Iniciais (Escala 1-100)</p>
    <div class="dgrid" id="dgrid"></div>
    <div class="startwrap">
      <button class="btnstart" id="btnstart">Iniciar os Jogos</button>
    </div>
  </div>
</div>

<div id="s-sim">
  <div class="wrap">
    <div class="simhdr">
      <h2>A Arena Histórica</h2>
    </div>
    <p class="alivebar" id="alivebar"></p>
    <div id="simcontent"></div>
  </div>
</div>

<div class="mbg" id="mbg">
  <div class="modal">
    <p class="mtitle">Ajustar Atributos</p>
    <label>Nome do Competidor</label>
    <input type="text" id="mn" maxlength="28">
    <label>Foto de Perfil</label>
    <div class="parea" id="parea">
      <img id="mimg" style="display:none" alt="foto">
      <div id="mph"><p>Clique para enviar imagem</p></div>
    </div>
    <input type="file" id="fin" accept="image/*" style="display:none">
    
    <label>Coragem — <span class="rval" id="rvc">50</span></label>
    <input type="range" id="mc" min="1" max="100">
    
    <label>Inteligência — <span class="rval" id="rvi">50</span></label>
    <input type="range" id="mi" min="1" max="100">
    
    <label>Força — <span class="rval" id="rvs">50</span></label>
    <input type="range" id="ms" min="1" max="100">
    
    <div class="mbtns">
      <button class="btn btns" id="mcancel">Cancelar</button>
      <button class="btn btnp" id="msave">Confirmar Ajustes</button>
    </div>
  </div>
</div>

<script>
var DISTRICTS = ['Distrito 1','Distrito 2','Distrito 3','Distrito 4','Distrito 5','Distrito 6','Distrito 7','Distrito 8','Distrito 9','Distrito 10','Distrito 11','Distrito 12'];
var DEFNAMES = [
  ['Lucas','Beatriz'], ['Gabriel','Mariana'], ['Felipe','Amanda'], ['Bruno','Larissa'],
  ['Rafael','Camila'], ['Thiago','Isabela'], ['Rodrigo','Juliana'], ['Gustavo','Letícia'],
  ['Daniel','Fernanda'], ['Leonardo','Caroline'], ['Matheus','Vitória'], ['Pedro','Sofia']
];
var DISTCOLORS = ['#e63946','#3a86c8','#a8dadc','#457b9d','#2a9d8f','#ffb703','#fb8500','#e76f51','#9c27b0','#4caf50','#ad5500','#e91e63'];
var WEAPON_EFFECTS = {
  "Mãos Nuas": "Sem Vantagem", "Faca": "Curto Alcance Veloz", "Arma de Fogo": "Dano Letal à Distância",
  "Arco e Flecha": "Tiro Silencioso", "Tridente": "Empalamento a Média Distância", "Besta de Caça": "Projétil Pesado",
  "Bomba Suicida": "Dano Mútuo Explosivo", "Martelo": "Esmagamento e Bloqueio", "Graveto Afiado": "Perfuração Rústica"
};

var tributes = [];
var editId = null;
var tempPhoto = null;
var currentDay = 0;
var deadHistory = [];
var escapedHistory = []; // tributos que fugiram
var lastActionType = {};

var globalEvent = null;
var globalEventDaysLeft = 0;
var globalEventTargetId = null;
var usedGlobalEvents = { "METEORO": false, "HEROI": false, "CHUVA_ACIDA": false, "BESTANTES": false, "INCENDIO": false, "FESTA": false, "ONDA_CRISE": false };

// Plano de fuga pendente para o próximo dia
// { proposerId, partnerId, accepted: bool }
var escapePlanPending = null;

var districtForteProgress = {};
var districtForteFinished = {};
var ritualProgress = {};
var lastMultiDayEventWeek = -1;

function ri(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }
function pct(n){ return Math.random()<n; }
function clamp(v,lo,hi){ return Math.max(lo,Math.min(hi,v)); }
function aliveList(){ return tributes.filter(function(t){ return t.alive && !t.escaped; }); }

// ============================================================
// VERIFICAÇÃO DE STAT MÁXIMO — dispara crise ao atingir 100
// ============================================================
function checkStatMax(t, stat, events) {
  if (!t.alive || t.escaped) return;
  if (t[stat] < 100) return;
  // Cada stat tem sua própria flag para não repetir
  var flagKey = 'crisisTriggered_' + stat;
  if (t[flagKey]) return;
  t[flagKey] = true;

  if (stat === 'courage') {
    t.supremeCourageDays = 3;
    t.crisisGlow = true;
    events.push({ id:[t.id], type:'crisis', text: t.name + ' atingiu CORAGEM MÁXIMA! Uma determinação sobre-humana tomou conta de seu ser — por 3 dias nenhum dano conseguirá tocá-lo! ⚡ DETERMINAÇÃO DIVINA ATIVADA!', status: 'Coragem Máxima' });
  } else if (stat === 'intel') {
    t.supremeIntelDays = 3;
    t.crisisGlow = true;
    events.push({ id:[t.id], type:'crisis', text: t.name + ' atingiu INTELIGÊNCIA MÁXIMA! Seu cérebro transcendeu os limites humanos — por 3 dias prevê e esquiva de qualquer ataque com perfeição! ⚡ MENTE SUPREMA ATIVADA!', status: 'Intel Máxima' });
  } else if (stat === 'strength') {
    t.supremeStrengthDays = 3;
    t.crisisGlow = true;
    events.push({ id:[t.id], type:'crisis', text: t.name + ' atingiu FORÇA MÁXIMA! Uma potência titânica flui em seus músculos — por 3 dias qualquer atacante será destruído instantaneamente! ⚡ FORÇA DE TITÃ ATIVADA!', status: 'Força Máxima' });
  }
}

function initTributes(){
  tributes=[]; deadHistory=[]; escapedHistory=[]; lastActionType={}; districtForteProgress={}; districtForteFinished={}; ritualProgress={};
  currentDay=0; globalEvent=null; globalEventDaysLeft=0; lastMultiDayEventWeek=-1; escapePlanPending=null;
  for(var k in usedGlobalEvents) usedGlobalEvents[k] = false;

  for(var d=0; d<12; d++){
    for(var s=0; s<2; s++){
      var persRoll = Math.random();
      var pers = null;
      if(persRoll < 0.10) pers = 'Psicopata';
      else if(persRoll < 0.20) pers = 'Esperto';
      else if(persRoll < 0.30) pers = 'Medroso';
      else if(persRoll < 0.40) pers = 'Trainer'; // NOVA PERSONALIDADE

      tributes.push({
        id: d*2+s, district: d, name: DEFNAMES[d][s], photo: null,
        health: 100, hunger: 100, thirst: 100,
        courage: ri(25,65), intel: ri(25,65), strength: ri(25,65),
        alive: true, escaped: false, dayDied: null, dayEscaped: null, grievedForPartner: false,
        weapon: null, crisisGlow: false, kills: 0, insanity: 0, personality: pers,
        supremeIntelDays: 0, supremeStrengthDays: 0, supremeCourageDays: 0, meteorBuffDays: 0,
        urgentRecoveryUsed: false, // flag: Recuperação Urgente só 1x por pessoa
        // flags de crise por stat
        crisisTriggered_courage: false,
        crisisTriggered_intel: false,
        crisisTriggered_strength: false
      });
    }
  }
}

function getTooltipHTML(t) {
  var effects = [];
  if(t.supremeIntelDays > 0) effects.push("Mente Suprema");
  if(t.supremeCourageDays > 0) effects.push("Determinação Divina");
  if(t.supremeStrengthDays > 0) effects.push("Força de Titã");
  if(t.insanity > 75) effects.push("Surto Psicótico");
  else if(t.insanity > 40) effects.push("Instável");
  if(t.escaped) effects.push("FUGIU DA ARENA");

  var effStr = effects.length ? effects.join(', ') : 'Nenhum';
  var wepStat = t.weapon ? WEAPON_EFFECTS[t.weapon] : WEAPON_EFFECTS["Mãos Nuas"];
  var pName = t.personality || 'Normal';

  return '<div class="thover-box">'
    +'<p><strong>'+t.name+'</strong> '+(t.kills !== undefined ? '| Kills: '+t.kills : '')+'</p>'
    +'<p>Vida: '+t.health+'/100</p>'
    +'<p>Fome: '+t.hunger+' | Sede: '+t.thirst+'</p>'
    +'<p>Cor: '+t.courage+' | Int: '+t.intel+' | For: '+t.strength+'</p>'
    +'<p class="spec-lbl">Perfil: '+pName+' | Insanidade: '+t.insanity+'</p>'
    +'<p class="spec-lbl">Efeitos Ativos: '+effStr+'</p>'
    +'<p class="inv-lbl">Arma: '+(t.weapon || 'Nenhuma')+' <br><span style="font-size:0.75rem; color:#ccc;">['+wepStat+']</span></p>'
  +'</div>';
}

function renderReaping(){
  var grid=document.getElementById('dgrid'); grid.innerHTML='';
  for(var d=0; d<12; d++){
    var t0=tributes[d*2], t1=tributes[d*2+1];
    var card=document.createElement('div');
    card.className='dcard';
    card.innerHTML='<div class="dhdr"><p class="dlbl">'+DISTRICTS[d]+'</p><div class="clr-picker">Cor: <input type="color" value="'+DISTCOLORS[d]+'" data-dist="'+d+'"></div></div><div class="trow">'+tCardHTML(t0)+tCardHTML(t1)+'</div>';

    card.querySelector('input[type=color]').addEventListener('input', function(){
      var distIdx = this.getAttribute('data-dist');
      DISTCOLORS[distIdx] = this.value;
      grid.querySelectorAll('.tpw-d' + distIdx).forEach(function(c) { c.style.backgroundColor = this.value; }, this);
    });

    (function(a,b){
      card.querySelectorAll('.tcard')[0].addEventListener('click',function(){ openModal(a.id); });
      card.querySelectorAll('.tcard')[1].addEventListener('click',function(){ openModal(b.id); });
    })(t0,t1);
    grid.appendChild(card);
  }
}

// ============================================================
// MORTE / DANO
// ============================================================
function checkDeath(t, rawDamage, reason, dailyDead, events, attacker) {
  if (!t.alive || t.escaped) return false;

  var dmgReduction = t.courage / 200;
  var actualDamage = Math.max(1, Math.floor(rawDamage * (1 - dmgReduction)));

  if (t.supremeCourageDays > 0) {
    events.push({ id:[t.id], type:"crisis", text: t.name + " sofreu danos (" + reason + "), mas sua determinação divina ignorou o ferimento por completo!", status: "Dano Anulado" });
    return false;
  }

  if (t.personality === 'Medroso' && attacker) {
    t.courage = clamp(t.courage - 25, 1, 100);
  }

  t.health = clamp(t.health - actualDamage, 0, 100);
  if (t.health <= 0) {
    if(t.weapon === "Bomba Suicida") {
      t.alive = false; t.dayDied = currentDay; dailyDead.push(t); deadHistory.push(t);
      if(attacker) attacker.kills++;
      t.weapon = null;
      events.push({ id:[t.id], type:"death", text: t.name + " foi ferido mortalmente, mas ativou seu dispositivo de " + reason + " detonando sua BOMBA SUICIDA e gerando um clarão devastador na clareira!", status: "MARTÍRIO" });
      return "BOMBA";
    }
    t.alive = false; t.dayDied = currentDay; dailyDead.push(t); deadHistory.push(t);
    if(attacker) attacker.kills++;
    events.push({ id:[t.id], type:"death", text: t.name + " sucumbiu fatalmente: " + reason, status: "ELIMINADO" });
    return true;
  }
  return false;
}

// ============================================================
// CONTRAGOLPE
// ============================================================
function processCounterAttack(attacker, defender, baseDamage, weaponName, dailyDead, events) {
  var defWep = defender.weapon || "Mãos Nuas";
  var counterChance = 0.25 + (defender.strength / 200);
  if (defender.personality === 'Esperto') counterChance += 0.20;

  if (Math.random() > counterChance) return false;

  if (defender.supremeStrengthDays > 0) {
    checkDeath(attacker, 55, "Tentou travar combate contra o titã de força " + defender.name + ", mas foi erguido pelo pescoço e quebrado ao meio.", dailyDead, events, defender);
    return true;
  }
  if (defender.supremeIntelDays > 0) {
    events.push({ id:[attacker.id, defender.id], type:"normal", text: attacker.name + " desferiu um bote mortal, mas " + defender.name + " previu os impulsos elétricos do ataque e desviou elegantemente.", status: "Esquiva Suprema" });
    return true;
  }

  if (defWep === "Martelo") {
    attacker.health = clamp(attacker.health - 25, 0, 100);
    events.push({ id:[attacker.id, defender.id], type:"bad", text: attacker.name + " avançou para golpear, mas " + defender.name + " usou a força para contra-atacar e usar o cabo do Martelo para quebrar as costelas do agressor (+15 Força)!", status: "Bloqueio de Martelo" });
    defender.strength = clamp(defender.strength + 15, 1, 100);
    checkDeath(attacker, 0, "Sucumbiu aos ferimentos internos do contra-ataque de Martelo.", dailyDead, events, defender);
    return true;
  }
  else if (defWep === "Faca") {
    attacker.health = clamp(attacker.health - 20, 0, 100);
    events.push({ id:[attacker.id, defender.id], type:"bad", text: attacker.name + " tentou encurralar " + defender.name + ", mas o defensor puxou uma Faca rapidamente e cortou o peito do atacante!", status: "Contra-ataque Cortante" });
    checkDeath(attacker, 0, "Sangrou até morrer após ser cortado no contra-ataque.", dailyDead, events, defender);
    return true;
  }
  else if (defWep === "Arma de Fogo" || defWep === "Besta de Caça") {
    var res = checkDeath(attacker, 100, "Tomou um tiro letal de resposta no peito ao tentar encurralar " + defender.name + ".", dailyDead, events, defender);
    if (!res) { events.push({ id:[attacker.id, defender.id], type:"bad", text: attacker.name + " tentou atacar, mas " + defender.name + " disparou sua arma para se defender! O atacante resistiu por pouco.", status: "Defesa Armada" }); }
    return true;
  }
  else if (defWep === "Arco e Flecha") {
    var res = checkDeath(attacker, 50, "Tomou uma flechada fatal ao tentar atacar " + defender.name + ".", dailyDead, events, defender);
    if (!res) { events.push({ id:[attacker.id, defender.id], type:"bad", text: attacker.name + " partiu para cima, mas " + defender.name + " puxou a corda do arco rapidamente e disparou uma flecha de defesa!", status: "Flechada Defensiva" }); }
    return true;
  }
  else if (defWep === "Tridente") {
    var res = checkDeath(attacker, 75, "Foi empalado pelo tridente longo de " + defender.name + ".", dailyDead, events, defender);
    if (!res) { events.push({ id:[attacker.id, defender.id], type:"bad", text: attacker.name + " avançou cego, mas " + defender.name + " usou o longo alcance de seu Tridente para perfurar e repelir o atacante!", status: "Empalado" }); }
    return true;
  }
  else if (defWep === "Bomba Suicida") {
    events.push({ id:[attacker.id, defender.id], type:"crisis", text: attacker.name + " recuou aterrorizado ao ver que " + defender.name + " abriu o casaco mostrando fios de C4 prontos para detonação caso fosse tocado! (+10 Insanidade)", status: "Ameaça Explosiva" });
    defender.insanity = clamp(defender.insanity + 10, 0, 100);
    return true;
  }
  else {
    attacker.health = clamp(attacker.health - 15, 0, 100);
    events.push({ id:[attacker.id, defender.id], type:"normal", text: attacker.name + " iniciou o ataque com " + weaponName + ", mas a Força de " + defender.name + " permitiu desviar o pulso do rival e encaixar um soco direto no queixo!", status: "CONTRAGOLPEADO" });
    checkDeath(attacker, 0, "Nocauteado e morto no chão após sofrer forte trauma craniano na defesa.", dailyDead, events, defender);
    return true;
  }
}

// ============================================================
// EVENTO: ONDA DE CRISE DE DISTRITO
// ============================================================
function applyOndaCrise(events, alv) {
  // Escolhe um distrito aleatório que ainda tem alguém vivo
  var districtPool = [];
  alv.forEach(function(t) {
    if(districtPool.indexOf(t.district) === -1) districtPool.push(t.district);
  });
  if(!districtPool.length) return;
  var targetDistrict = districtPool[ri(0, districtPool.length - 1)];
  var victimList = alv.filter(function(t){ return t.district === targetDistrict; });

  // Tipos de crise ruim
  var criseTypes = [
    {
      name: "Surto de Paranoia Coletiva",
      apply: function(t) {
        t.insanity = clamp(t.insanity + ri(25,45), 0, 100);
        t.intel = clamp(t.intel - ri(15,25), 1, 100);
        return t.name + " entrou em colapso psicótico. Insanidade +30~45, Inteligência -15~25.";
      }
    },
    {
      name: "Gás Alucinógeno",
      apply: function(t) {
        t.insanity = clamp(t.insanity + ri(20,35), 0, 100);
        t.courage = clamp(t.courage - ri(20,30), 1, 100);
        return t.name + " inalou o gás e entrou em delírio, perdendo controle dos sentidos. Insanidade +20~35, Coragem -20~30.";
      }
    },
    {
      name: "Enfraquecimento Muscular",
      apply: function(t) {
        t.strength = clamp(t.strength - ri(25,40), 1, 100);
        t.health = clamp(t.health - ri(10,20), 1, 100);
        return t.name + " sentiu os membros ficarem de gelatina por uma toxina injetada na água. Força -25~40, Vida -10~20.";
      }
    },
    {
      name: "Apagão de Memória",
      apply: function(t) {
        t.intel = clamp(t.intel - ri(30,45), 1, 100);
        t.weapon = null;
        return t.name + " perdeu memórias críticas de sobrevivência após um pulso eletromagnético cerebral. Inteligência -30~45, Arma perdida.";
      }
    }
  ];

  var crise = criseTypes[ri(0, criseTypes.length - 1)];
  var descLines = [];
  victimList.forEach(function(t) {
    var desc = crise.apply(t);
    descLines.push(desc);
    // Verifica se stat caiu muito (não aplica max aqui, é crise de baixa)
  });

  var idsList = victimList.map(function(t){ return t.id; });
  events.push({
    id: idsList,
    type: 'crisis',
    text: '⚡ ONDA DE CRISE — ' + DISTRICTS[targetDistrict].toUpperCase() + ': O Capitólio ativou o protocolo "' + crise.name + '" sobre o ' + DISTRICTS[targetDistrict] + '! ' + descLines.join(' '),
    status: crise.name
  });
}

// ============================================================
// EVENTO: PLANO DE FUGA (proposta no dia atual, resolução no próximo)
// ============================================================
function tryProposarFuga(alv, events) {
  if(escapePlanPending) return; // já tem um pendente
  if(alv.length < 3) return; // precisa de pelo menos 3 pra valer (evita final)

  // Escolhe dois de distritos diferentes
  var shuffled = alv.slice().sort(function(){ return Math.random() - 0.5; });
  var proposer = null, partner = null;
  for(var i=0; i<shuffled.length; i++){
    for(var j=i+1; j<shuffled.length; j++){
      if(shuffled[i].district !== shuffled[j].district){
        proposer = shuffled[i];
        partner = shuffled[j];
        break;
      }
    }
    if(proposer) break;
  }
  if(!proposer || !partner) return;

  // 50% de aceitar
  var accepted = Math.random() < 0.5;

  if(accepted) {
    escapePlanPending = { proposerId: proposer.id, partnerId: partner.id };
    events.push({
      id: [proposer.id, partner.id],
      type: 'edescape',
      text: '🗺️ PLANO DE FUGA: ' + proposer.name + ' (' + DISTRICTS[proposer.district] + ') aproximou-se sorrateiramente de ' + partner.name + ' (' + DISTRICTS[partner.district] + ') com um mapa improvisado da grade elétrica. O parceiro analisou friamente e... ACEITOU O PLANO! Amanhã ao amanhecer, eles tentarão fugir pelos túneis de manutenção da arena!',
      status: 'Fuga Planejada'
    });
  } else {
    events.push({
      id: [proposer.id, partner.id],
      type: 'normal',
      text: '🗺️ PROPOSTA RECUSADA: ' + proposer.name + ' arriscou tudo propondo uma aliança de fuga para ' + partner.name + '. Após um silêncio gélido, ' + partner.name + ' recusou com um olhar frio: "Só um sai vivo." O clima entre os dois ficou tenso.',
      status: 'Fuga Negada'
    });
  }
}

// ============================================================
// RESOLVER FUGA (no início do próximo dia)
// ============================================================
function resolverFuga(events, dailyDead) {
  if(!escapePlanPending) return;
  var plan = escapePlanPending;
  escapePlanPending = null;

  var p1 = tributes[plan.proposerId];
  var p2 = tributes[plan.partnerId];

  if(!p1 || !p2 || !p1.alive || !p2.alive || p1.escaped || p2.escaped) return;

  // Score de fuga: média ponderada de coragem + intel + força + vida, penalizado por insanidade
  function escapeScore(t) {
    return (t.courage * 0.35 + t.intel * 0.35 + t.strength * 0.20 + t.health * 0.10) - (t.insanity * 0.15);
  }

  var score1 = escapeScore(p1);
  var score2 = escapeScore(p2);
  var avgScore = (score1 + score2) / 2;
  // Threshold base 45, mais difícil se stats baixos, mais fácil se altos
  var escapeThreshold = 45;

  var success = avgScore >= escapeThreshold;

  if(success) {
    // Ambos escapam!
    p1.escaped = true; p1.alive = false; p1.dayEscaped = currentDay;
    p2.escaped = true; p2.alive = false; p2.dayEscaped = currentDay;
    escapedHistory.push(p1, p2);
    events.push({
      id: [p1.id, p2.id],
      type: 'edescape',
      text: '🏃 FUGA BEM-SUCEDIDA! ' + p1.name + ' e ' + p2.name + ' usaram seus conhecimentos combinados para hackear o painel de controle da grade e abriram uma brecha nos túneis subterrâneos. Os Peacekeepers chegaram tarde demais — dois tributos escaparam da arena e voltaram para suas famílias! O Capitólio está furioso.',
      status: 'ESCAPARAM!'
    });
  } else {
    // Falha — luta contra os guardas, quem tem mais força/vida sobrevive, o outro morre
    var survived = null, died = null;
    if(score1 >= score2) { survived = p1; died = p2; }
    else { survived = p2; died = p1; }

    // Dano para quem sobreviveu
    survived.health = clamp(survived.health - ri(25,45), 0, 100);

    var diedActually = survived.health <= 0;

    if(diedActually) {
      // Os dois morrem
      p1.alive = false; p1.dayDied = currentDay; dailyDead.push(p1); deadHistory.push(p1);
      p2.alive = false; p2.dayDied = currentDay; dailyDead.push(p2); deadHistory.push(p2);
      events.push({
        id: [p1.id, p2.id],
        type: 'death',
        text: '💀 FUGA FRACASSADA: ' + p1.name + ' e ' + p2.name + ' chegaram aos túneis, mas foram emboscados por uma patrulha pesada de Peacekeepers. Após uma batalha brutal nos corredores escuros, ambos sucumbiram aos ferimentos. O Capitólio executa os fugitivos como exemplo.',
        status: 'CAPTURADOS E MORTOS'
      });
    } else {
      died.alive = false; died.dayDied = currentDay; dailyDead.push(died); deadHistory.push(died);
      events.push({
        id: [p1.id, p2.id],
        type: 'death',
        text: '⚔️ FUGA PARCIAL: ' + p1.name + ' e ' + p2.name + ' bateram de frente com a guarda armada nos túneis. Em meio ao caos, ' + died.name + ' foi abatido pelos Peacekeepers cobrindo a retirada. ' + survived.name + ' sobreviveu ferido mas foi recapturado e devolvido à arena.',
        status: 'Fuga Fracassada'
      });
    }
  }
}

// ============================================================
// GERAÇÃO DO DIA
// ============================================================
function generateNextDayDynamic(){
  currentDay++;
  var alv = aliveList();
  if(alv.length <= 1) return null;

  var events = []; var dailyDead = [];
  var currentWeek = Math.floor((currentDay - 1) / 7);

  // --- Resolver fuga pendente ANTES de tudo ---
  if(escapePlanPending) {
    resolverFuga(events, dailyDead);
    alv = aliveList();
    if(alv.length <= 1) {
      return { day: currentDay, gev: { name: "Resolução da Fuga", text: "Os eventos da tentativa de fuga definiram o destino dos últimos combatentes." }, events: events, dead: dailyDead };
    }
  }

  // ================= 1. EVENTOS GLOBAIS =================
  var txtGev = "O Capitólio monitora os sinais vitais dos guerreiros. O sol desponta na arena hostil."; var tagGev = "Estável";

  if(currentDay === 1) {
    txtGev = "O BANHO DE SANGUE: O gongo soou! Os tributos descem desesperados de seus pedestais. A Corrida para a Cornucópia recheada de armas começou e o caos é absoluto!";
    tagGev = "A Cornucópia";
  }
  else if (globalEventDaysLeft <= 0) {
    // CHANCE AUMENTADA: 35% (era 18%)
    if (pct(0.35)) {
      var poolG = [];
      if(!usedGlobalEvents["METEORO"]) poolG.push("METEORO");
      if(!usedGlobalEvents["HEROI"]) poolG.push("HEROI");
      if(!usedGlobalEvents["CHUVA_ACIDA"]) poolG.push("CHUVA_ACIDA");
      if(!usedGlobalEvents["BESTANTES"]) poolG.push("BESTANTES");
      if(!usedGlobalEvents["INCENDIO"]) poolG.push("INCENDIO");
      if(currentDay > 4 && alv.length > 4 && !usedGlobalEvents["FESTA"]) poolG.push("FESTA");
      // ONDA DE CRISE pode repetir (não usa usedGlobalEvents)
      poolG.push("ONDA_CRISE");
      poolG.push("ONDA_CRISE"); // peso duplo

      if(poolG.length > 0) {
        globalEvent = poolG[ri(0, poolG.length - 1)];
        if(globalEvent !== "ONDA_CRISE") usedGlobalEvents[globalEvent] = true;

        if (globalEvent === "METEORO") { globalEventDaysLeft = 3; var pTarget = alv[ri(0, alv.length - 1)]; globalEventTargetId = pTarget.id; pTarget.meteorBuffDays = 3; pTarget.strength = clamp(pTarget.strength + 30, 1, 100); }
        else if (globalEvent === "HEROI") { globalEventDaysLeft = 2; }
        else if (globalEvent === "CHUVA_ACIDA") { globalEventDaysLeft = 1; }
        else if (globalEvent === "BESTANTES") { globalEventDaysLeft = 1; }
        else if (globalEvent === "INCENDIO") { globalEventDaysLeft = 2; }
        else if (globalEvent === "FESTA") { globalEventDaysLeft = 1; }
        else if (globalEvent === "ONDA_CRISE") { globalEventDaysLeft = 1; }
      } else { globalEvent = null; }
    } else { globalEvent = null; }
  }

  // APLICAR EFEITOS GLOBAIS
  if (globalEvent === "METEORO") {
    var tgt = tributes[globalEventTargetId];
    txtGev = "A queda de um meteoro radioativo iluminou a arena! A poeira cósmica concedeu mutações de força a " + (tgt && tgt.alive ? tgt.name : "um quadrante isolado") + ".";
    tagGev = "Meteoro Cadente"; globalEventDaysLeft--;
  }
  else if (globalEvent === "HEROI") {
    txtGev = globalEventDaysLeft === 2 ? "Um Herói Patrocinador mascarado invadiu ilegalmente o perímetro portando fuzis pesados!" : "O Herói invasor foi abatido pelas snipers automáticas do Capitólio nas bordas da Arena.";
    tagGev = "Invasor na Arena"; globalEventDaysLeft--;
  }
  else if (globalEvent === "CHUVA_ACIDA") {
    txtGev = "Uma nuvem tóxica de Chuva Ácida cobriu as matas, castigando gravemente quem estava sem abrigo fortificado!";
    tagGev = "Chuva Ácida"; globalEventDaysLeft--;
    alv.forEach(function(t) {
      if(!districtForteFinished[t.district]) checkDeath(t, 25, "Sofreu queimaduras químicas fatais da chuva tóxica.", dailyDead, events);
    });
  }
  else if (globalEvent === "BESTANTES") {
    txtGev = "MUTAÇÃO LIBERADA: Matilhas de Lobos-Bestantes foram soltas pelos Idealizadores! Gritos ecoam pela arena.";
    tagGev = "Bestantes Selvagens"; globalEventDaysLeft--;
    alv.forEach(function(t) {
      if(!t.weapon || t.weapon === "Graveto Afiado") checkDeath(t, 45, "Foi despedaçado vivo pelas garras dos Bestantes do Capitólio.", dailyDead, events);
      else { t.health = clamp(t.health - 15, 0, 100); events.push({ id:[t.id], type:"normal", text: t.name + " usou sua arma (" + t.weapon + ") para lutar e espantar os Bestantes, saindo com arranhões.", status: "Sobreviveu à Matilha" }); checkDeath(t, 0, "Sangrou até morrer após o ataque dos bestantes.", dailyDead, events); }
    });
  }
  else if (globalEvent === "INCENDIO") {
    txtGev = "INCÊNDIO FLORESTAL: Os Idealizadores colocaram fogo nas bordas da arena! Todos estão sendo forçados a correr para o centro, reduzindo os esconderijos.";
    tagGev = "Fogo na Arena"; globalEventDaysLeft--;
    alv.forEach(function(t) {
      t.thirst = clamp(t.thirst - 20, 0, 100);
      if(t.courage < 40) checkDeath(t, 30, "Foi encurralado pelas chamas e morreu por asfixia com a fumaça.", dailyDead, events);
    });
  }
  else if (globalEvent === "FESTA") {
    txtGev = "O BANQUETE: O Capitólio anunciou um grande banquete na Cornucópia, com mochilas contendo exatamente o que cada um mais precisa. Quem terá a coragem de ir?";
    tagGev = "Banquete Oficial"; globalEventDaysLeft--;
  }
  else if (globalEvent === "ONDA_CRISE") {
    txtGev = "ALERTA DO CAPITÓLIO: Uma onda de interferência psico-eletrônica foi disparada sobre uma zona da arena. Os efeitos são devastadores para quem foi atingido!";
    tagGev = "Onda de Crise"; globalEventDaysLeft--;
    applyOndaCrise(events, aliveList());
  }

  // ================= 2. TIMERS E BIOLOGIA =================
  tributes.forEach(function(t){
    if(!t.alive || t.escaped) return;
    t.crisisGlow = false;

    if(t.supremeIntelDays > 0) { t.supremeIntelDays--; t.crisisGlow = true; if(t.supremeIntelDays === 0) t.intel = clamp(t.intel, 1, 100); }
    if(t.supremeStrengthDays > 0) { t.supremeStrengthDays--; t.crisisGlow = true; if(t.supremeStrengthDays === 0) t.strength = clamp(t.strength, 1, 100); }
    if(t.supremeCourageDays > 0) { t.supremeCourageDays--; t.crisisGlow = true; if(t.supremeCourageDays === 0) t.courage = clamp(t.courage, 1, 100); }
    if(t.meteorBuffDays > 0) { t.meteorBuffDays--; if(t.meteorBuffDays === 0) { t.strength = clamp(t.strength - 30, 1, 100); } }

    if (t.hunger <= 0) checkDeath(t, 20, "Faleceu devido à subnutrição severa crônica.", dailyDead, events);
    if (t.thirst <= 0) checkDeath(t, 25, "Faleceu por desidratação crítica nas entranhas da mata.", dailyDead, events);

    t.hunger = clamp(t.hunger - ri(5, 10), 0, 100);
    t.thirst = clamp(t.thirst - ri(7, 12), 0, 100);
  });

  alv = aliveList();
  var processedIds = {};

  // ================= 3. POOL PRINCIPAL DE AÇÕES =================
  for(var i=0; i<alv.length; i++){
    var t = alv[i];
    if(processedIds[t.id] || !t.alive || t.escaped) continue;

    // --- RECUPERAÇÃO URGENTE (1x por pessoa) ---
    if (t.health < 30 && !t.urgentRecoveryUsed) {
      t.urgentRecoveryUsed = true;
      t.health = clamp(t.health + ri(15, 30), 0, 100);
      events.push({ id:[t.id], type:"normal", text: t.name + " estava à beira da morte e passou o dia todo escondido nas sombras curando seus ferimentos graves desesperadamente (+Vida). (Recuperação Urgente usada — não poderá ser usada novamente!)", status: "Recuperação Urgente" });
      processedIds[t.id] = true; continue;
    }
    // Se saúde crítica mas já usou a Recuperação Urgente, não faz essa ação especial
    if (t.health < 20) {
      // Está em risco mas não pode usar recuperação — continua com o pool normal
    }

    if (t.hunger <= 35 || t.thirst <= 35) {
      t.hunger = 100; t.thirst = 100;
      events.push({ id:[t.id], type:"normal", text: t.name + " estava sucumbindo à fome/sede e gastou todo seu foco buscando água barrenta e raízes, saciando suas necessidades totalmente (+Fome/Sede).", status: "Instinto de Sobrevivência" });
      processedIds[t.id] = true; continue;
    }

    // CHANCE AUMENTADA de eventos raros: roll de 1-12 (era 1-15)
    var roll = ri(1, 12);

    // Psicopatas forçam rolagens de ataque mais frequentemente
    if (t.personality === 'Psicopata' && ri(1, 100) <= 45) roll = ri(1, 3);
    // Trainers: muito mais chance de treino
    if (t.personality === 'Trainer' && ri(1, 100) <= 55) roll = ri(7, 8);

    if (currentDay === 1) { var bloodbathActions = [1, 2, 3, 4, 4, 4, 6, 9]; roll = bloodbathActions[ri(0, bloodbathActions.length - 1)]; }
    else if (globalEvent === "FESTA") { var feastActions = [1, 2, 3, 4, 4, 6, 9]; roll = feastActions[ri(0, feastActions.length - 1)]; }

    var other = null;
    var validOthers = alv.filter(function(o){ return o.id !== t.id && !processedIds[o.id]; });
    if(validOthers.length > 0) other = validOthers[ri(0, validOthers.length-1)];

    // === EVENTO RARO: PLANO DE FUGA (roll 11-12, ~16.6% chance, requer alv >= 3) ===
    if (roll >= 11 && other && alv.length >= 3 && !escapePlanPending && currentDay > 2) {
      tryProposarFuga(alv, events);
      processedIds[t.id] = true;
      if(other) processedIds[other.id] = true;
      continue;
    }

    // 1 a 3. ATAQUES COM ARMAS ESPECÍFICAS
    if (roll >= 1 && roll <= 3 && other) {
      var evadeChance = other.intel / 200;
      if(other.personality === 'Esperto') evadeChance += 0.2;
      if(Math.random() < evadeChance) {
        events.push({ id:[t.id, other.id], type:"normal", text: "FALHA E ESQUIVA: " + t.name + " tentou emboscar de surpresa, mas a alta Inteligência de " + other.name + " permitiu prever e esquivar perfeitamente do ataque! (+10 Coragem p/ Alvo)", status: "Esquiva Perfeita" });
        other.courage = clamp(other.courage + 10, 1, 100);
        checkStatMax(other, 'courage', events);
        processedIds[t.id] = true; processedIds[other.id] = true; continue;
      }

      if (t.weapon) {
        var failChance = 0.20;
        if (t.weapon === 'Arma de Fogo' || t.weapon === 'Tridente' || t.weapon === 'Besta de Caça') failChance = 0.30;
        if (Math.random() < failChance) {
          var msg = "FALHA DA ARMA: " + t.name + " atacou furiosamente com seu(a) " + t.weapon + ", mas a arma falhou/engasgou no momento crucial!";
          if (Math.random() < 0.4) { msg += " Pior, a arma quebrou no processo e se perdeu!"; t.weapon = null; }
          events.push({ id:[t.id, other.id], type:"normal", text: msg, status: "Falha Miserável" });
          processedIds[t.id] = true; processedIds[other.id] = true; continue;
        }
      }

      if (t.weapon === "Faca") {
        var blocked = processCounterAttack(t, other, 100, "Faca", dailyDead, events);
        if (!blocked) {
          events.push({ id:[t.id, other.id], type:"bad", text: "ATAQUE BEM SUCEDIDO: " + t.name + " saltou desferindo um golpe veloz e certeiro com sua Faca no peito de " + other.name + ".", status: "Investida Cortante" });
          var res = checkDeath(other, 80, "Recebeu um golpe de faca desferido por " + t.name + ".", dailyDead, events, t);
          if(!res) { other.strength = clamp(other.strength + 10, 0, 100); checkStatMax(other, 'strength', events); }
        }
      }
      else if (t.weapon === "Arco e Flecha" || t.weapon === "Besta de Caça") {
        var blocked = processCounterAttack(t, other, 100, t.weapon, dailyDead, events);
        if (!blocked) {
          events.push({ id:[t.id, other.id], type:"bad", text: "DISPARO EFETUADO: Escondido, " + t.name + " mirou cuidadosamente e disparou com seu " + t.weapon + " contra " + other.name + "!", status: "Fogo à Distância" });
          checkDeath(other, 100, "Alvejado fatalmente por um projétil atirado por " + t.name + ".", dailyDead, events, t);
        }
      }
      else if (t.weapon === "Tridente") {
        var blocked = processCounterAttack(t, other, 100, "Tridente", dailyDead, events);
        if (!blocked) {
          events.push({ id:[t.id, other.id], type:"bad", text: "ATAQUE BRUTAL: Com fúria nos olhos, " + t.name + " arremessou o Tridente diretamente contra o corpo de " + other.name + ".", status: "Golpe de Tridente" });
          checkDeath(other, 95, "Foi empalado pelo tridente de " + t.name + ".", dailyDead, events, t);
        }
      }
      else { roll = 6; }
      if(roll <= 3) { processedIds[t.id] = true; if(other && !processedIds[other.id]) processedIds[other.id] = true; continue; }
    }

    // 4. COLETA DE ITENS
    if (roll === 4) {
      if (!t.weapon || t.weapon === "Graveto Afiado" || currentDay === 1 || globalEvent === "FESTA") {
        var wepPool = ["Martelo", "Bomba Suicida", "Faca", "Graveto Afiado", "Arma de Fogo", "Arco e Flecha", "Tridente", "Mochila de Suprimentos", "Besta de Caça"];
        var w = wepPool[ri(0, wepPool.length - 1)];
        if (w === "Mochila de Suprimentos") {
          t.health = clamp(t.health + 40, 0, 100); t.hunger = 100; t.thirst = 100;
          events.push({ id:[t.id], type:"normal", text: t.name + " encontrou uma Mochila de Suprimentos! Curou ferimentos e encheu a barriga (+Vida/Fome).", status: "Cura Total" });
        } else {
          t.weapon = w;
          events.push({ id:[t.id], type:"normal", text: t.name + " vasculhou a mata e equipou uma nova arma letal: " + w + "!", status: "Novo Equipamento" });
        }
      }
      processedIds[t.id] = true; continue;
    }

    // 5. SOBREVIVÊNCIA NATURAL
    if (roll === 5) {
      t.hunger = clamp(t.hunger + 40, 0, 100); t.thirst = clamp(t.thirst + 40, 0, 100); t.intel = clamp(t.intel + 5, 0, 100);
      checkStatMax(t, 'intel', events);
      events.push({ id:[t.id], type:"normal", text: t.name + " passou o dia caçando com precisão e purificando água barrenta com iodo. (+5 Intel)", status: "Rotina na Selva" });
      processedIds[t.id] = true; continue;
    }

    // 6. COMBATE DESARMADO
    if (roll === 6 && other) {
      t.hunger = clamp(t.hunger - 10, 0, 100);
      var blocked = processCounterAttack(t, other, 50, "Mãos Nuas", dailyDead, events);
      if (!blocked) {
        events.push({ id:[t.id, other.id], type:"bad", text: "ESPANCO: " + t.name + " pulou sobre " + other.name + " desferindo uma sequência agressiva de socos!", status: "Combate Corporal" });
        var dmg = ri(20, 50) + Math.floor(t.strength / 3);
        checkDeath(other, dmg, "Foi espancado até a inconsciência por " + t.name + ".", dailyDead, events, t);
      }
      processedIds[t.id] = true; if(other) processedIds[other.id] = true; continue;
    }

    // 7. TREINO (INTELIGÊNCIA)
    if (roll === 7) {
      var intelGain = t.personality === 'Trainer' ? ri(15,25) : 15;
      t.intel = clamp(t.intel + intelGain, 0, 100);
      checkStatMax(t, 'intel', events);
      var trainerBonus = t.personality === 'Trainer' ? ' (Trainer: bônus extra de foco!)' : '';
      events.push({ id:[t.id], type:"normal", text: t.name + " subiu silenciosamente até as copas mais altas para mapear a arena meticulosamente. (+" + intelGain + " Intel)" + trainerBonus, status: t.personality === 'Trainer' ? "Treinamento Tático" : "Intelecto Superior" });
      processedIds[t.id] = true; continue;
    }

    // 8. TREINO (FORÇA / CORAGEM / SAÚDE)
    if (roll === 8) {
      var trainRoll = ri(1, 3);
      // Trainers têm mais chance de ganhar stats de treino altos
      var statGain = t.personality === 'Trainer' ? ri(18, 30) : 15;
      var trainerTxt = t.personality === 'Trainer' ? ' O regime de treino do Trainer extrai o máximo do corpo!' : '';

      if(trainRoll === 1){
        t.strength = clamp(t.strength + statGain, 0, 100);
        checkStatMax(t, 'strength', events);
        events.push({ id:[t.id], type:"normal", text: t.name + " ergueu rochas pesadas durante a tarde inteira para calejamento muscular brutal. (+" + statGain + " Força)" + trainerTxt, status: t.personality === 'Trainer' ? "Regime Extremo" : "Treinamento Físico" });
      } else if(trainRoll === 2) {
        t.courage = clamp(t.courage + statGain, 0, 100);
        checkStatMax(t, 'courage', events);
        events.push({ id:[t.id], type:"normal", text: t.name + " mediou em cima de uma pedra alta, confrontando seus medos internos e saindo mais resoluto que nunca. (+" + statGain + " Coragem)" + trainerTxt, status: t.personality === 'Trainer' ? "Fortalecimento Mental" : "Meditação Guerreira" });
      } else {
        t.health = clamp(t.health + 30, 0, 100); t.thirst = 100;
        events.push({ id:[t.id], type:"normal", text: "UM PRESENTE! O carisma de " + t.name + " atraiu um Patrocinador do Capitólio que lhe enviou pomada curativa por paraquedas. (+30 Vida)", status: "Patrocínio" });
      }
      processedIds[t.id] = true; continue;
    }

    // 9. ARMADILHAS
    if (roll === 9 && other) {
      var trapEvadeChance = other.intel / 150;
      if(other.personality === 'Esperto') trapEvadeChance += 0.2;
      if(Math.random() < trapEvadeChance) {
        events.push({ id:[t.id, other.id], type:"normal", text: "ARMADILHA EVITADA: " + t.name + " montou uma tocaia elaborada, mas " + other.name + " notou os fios disfarçados a tempo e escapou ileso! (+10 Intel p/ Vítima)", status: "Astúcia" });
        other.intel = clamp(other.intel + 10, 1, 100);
        checkStatMax(other, 'intel', events);
      } else {
        events.push({ id:[t.id, other.id], type:"bad", text: "ARMADILHA LETAL: " + t.name + " montou uma armadilha nas folhagens. " + other.name + " caminhou desatento e foi içado violentamente pelas pernas!", status: "Caiu na Armadilha" });
        checkDeath(other, ri(35, 75), "Foi triturado por uma armadilha mecânica projetada por " + t.name + ".", dailyDead, events, t);
      }
      processedIds[t.id] = true; processedIds[other.id] = true; continue;
    }

    // 10. LUTO / NEUTRALO
    var partnerId = (t.id % 2 === 0) ? t.id + 1 : t.id - 1;
    var partner = tributes[partnerId];

    if (!partner.alive && !partner.escaped && !t.grievedForPartner) {
      t.strength = clamp(t.strength + 15, 0, 100);
      t.insanity = clamp(t.insanity + 30, 0, 100);
      checkStatMax(t, 'strength', events);
      events.push({ id:[t.id], type:"crisis", text: t.name + " chorou amargamente a perda oficial de seu parceiro de distrito, quebrando seu psicológico mas transformando o luto em fúria homicida (+15 Força, +30 Insanidade).", status: "Luto Sombrio" });
      t.grievedForPartner = true;
      processedIds[t.id] = true; continue;
    }

    t.courage = clamp(t.courage + 12, 0, 100);
    checkStatMax(t, 'courage', events);
    var randomNeutralTxt = [
      t.name + " lavou o rosto nas margens lamacentas, camuflando a pele com terra preta e blindando sua mente. (+12 Coragem)",
      t.name + " se abrigou sob uma grande rocha, afiando suas ferramentas improvisadas com uma pedra e focando na vitória. (+12 Coragem)",
      t.name + " escutou o som dos canhões à distância e fez um juramento silencioso de vencer custe o que custar. (+12 Coragem)"
    ];
    events.push({ id:[t.id], type:"normal", text: randomNeutralTxt[ri(0, randomNeutralTxt.length - 1)], status: "Sobrevivência" });
    processedIds[t.id] = true;
  }

  return { day: currentDay, gev: { name: tagGev, text: txtGev }, events: events, dead: dailyDead };
}

// ============================================================
// RENDER
// ============================================================
function handleNextDayClick(){
  var data = generateNextDayDynamic();
  var con = document.getElementById('simcontent');
  if(!data) { renderVictor(con); return; }

  var block = document.createElement('div'); block.className = 'dayblock';
  var evHTML = '';

  data.events.forEach(function(e){
    var cls = '';
    if(e.type === 'death') cls = 'eddeath';
    else if(e.type === 'bad') cls = 'edbad';
    else if(e.type === 'crisis') cls = 'edcrisis';
    else if(e.type === 'edescape') cls = 'edescape';

    var picsHTML = '<div class="ev-pics">';
    e.id.forEach(function(pId){
      var t = tributes[pId]; if(!t) return;
      var ph = t.photo ? '<img src="'+t.photo+'">' : '<div class="tphd">'+t.name[0]+'</div>';
      var dColor = DISTCOLORS[t.district];
      var glowClass = t.crisisGlow ? 'glow-crisis' : (t.escaped ? 'glow-escape' : '');
      picsHTML += '<div class="ev-pcard">'
        + getTooltipHTML(t)
        +'<div class="ev-pw '+glowClass+'" style="background-color:'+dColor+'">'+ph+'</div>'
        +'<div class="pname">'+t.name+'</div>'
        +'</div>';
    });
    picsHTML += '</div>';

    var statusCls = (e.type === 'edescape') ? 'v-status escape-st' : (e.type === 'crisis' ? 'v-status crisis-st' : 'v-status');
    var statusDisplay = e.status ? '<span class="'+statusCls+'">' + e.status + '</span>' : '';
    evHTML += '<div class="evitem '+cls+'">' + picsHTML + '<div class="evtxt">' + e.text + statusDisplay + '</div></div>';
  });

  block.innerHTML = '<div class="dayhdr"><span class="daynum">Dia '+data.day+'</span><div class="daysep"></div><span class="dayevtname">'+data.gev.name+'</span></div><div class="gevt"><span class="gstatus">Eventos da Arena</span>'+data.gev.text+'</div><div class="evlist">'+evHTML+'</div>';
  con.innerHTML = ''; con.appendChild(block);
  window.scrollTo({top:0, behavior:'smooth'});

  if(data.dead.length > 0){
    var bar = document.createElement('div'); bar.className = 'dbar';
    bar.innerHTML = data.dead.length + ' disparo(s) de canhão ecoou(aram) nos céus, marcando o luto oficial em Panem.';
    con.appendChild(bar);
  }

  // Fugitivos
  if(escapedHistory.length > 0){
    var escBlock = document.createElement('div'); escBlock.className = 'escapedblock';
    var escNames = escapedHistory.map(function(t){ return t.name; }).join(' & ');
    escBlock.innerHTML = '<h3>🏃 Fugitivos da Arena</h3><p style="color:#90e0ef;">'+escNames+' abandonaram os Jogos. O Capitólio furioso aumenta a dificuldade para os restantes.</p>';
    con.appendChild(escBlock);
  }

  if(data.day % 2 === 0 && deadHistory.length > 0){
    var mem = document.createElement('div'); mem.className = 'memoriam';
    var mhtml = deadHistory.map(function(t){
      var mph = t.photo ? '<img src="'+t.photo+'">' : '<div class="memphi">'+t.name[0]+'</div>';
      return '<div class="mementry"><div class="mphi-w" style="background-color:'+DISTCOLORS[t.district]+'">'+mph+'</div><div class="memname">'+t.name+'</div><div class="memday">Dia '+t.dayDied+'</div></div>';
    }).join('');
    mem.innerHTML = '<div class="sec-title" style="font-size:1rem; margin-bottom:10px;">In Memoriam — Holograma dos Falecidos</div><div class="memgrid">'+mhtml+'</div>';
    con.appendChild(mem);
  }

  var a = aliveList().length; var d = 24 - a - escapedHistory.length;
  var escTxt = escapedHistory.length > 0 ? ' — <strong style="color:#00b4d8;">'+escapedHistory.length+' fugitivo(s)</strong>' : '';
  document.getElementById('alivebar').innerHTML = '<strong>'+a+'</strong> guerreiros restantes — <strong>'+d+'</strong> eliminados' + escTxt;

  var bwrap = document.createElement('div'); bwrap.className = 'nextwrap';
  bwrap.innerHTML = (a <= 1) ? '<button class="btnnext" id="btnnext">Ver o Campeão</button>' : '<button class="btnnext" id="btnnext">Gerar Turno do Próximo Dia</button>';
  con.appendChild(bwrap);

  document.getElementById('btnnext').onclick = handleNextDayClick;
}

document.getElementById('btnstart').onclick=function(){
  document.getElementById('s-reaping').style.display='none';
  document.getElementById('s-sim').style.display='block';
  var a = aliveList().length;
  document.getElementById('alivebar').innerHTML = '<strong>'+a+'</strong> guerreiros restantes — <strong>0</strong> eliminados';
  handleNextDayClick();
};

function renderVictor(con){
  var alv=aliveList();
  if(!alv.length){
    var finalMsg = escapedHistory.length > 0
      ? 'Os últimos combatentes caíram. Panem chora a falta de um Vitorioso oficial, mas ' + escapedHistory.length + ' alma(s) escapou(aram) para a liberdade.'
      : 'A brutalidade mútua da arena engoliu os últimos competidores ao mesmo tempo. Panem chora a falta de um Vitorioso.';
    con.innerHTML='<div class="victorblock"><p class="victorname">Nenhum Sobrevivente</p><p class="victorquote">'+finalMsg+'</p><button class="btnrestart" onclick="restartGame()">Gerar Novo Ano de Simulação</button></div>';
    return;
  }
  var v=alv[0];
  var ph=v.photo?'<img class="victorphoto" src="'+v.photo+'">':'<div class="victorphi">'+v.name[0]+'</div>';
  var escFin = escapedHistory.length > 0 ? '<p style="color:#00b4d8; margin-top:16px; font-size:1rem;">⚠️ '+escapedHistory.length+' tributo(s) escapou(aram) da arena sem ser vencedor(es): '+escapedHistory.map(function(t){return t.name;}).join(', ')+'</p>' : '';
  con.innerHTML='<div class="victorblock"><p class="sec-title">Consagrado Vitorioso</p><div class="victor-w" style="background-color:'+DISTCOLORS[v.district]+'">'+ph+'</div><h2 class="victorname">'+v.name+'</h2><p class="victordist">'+DISTRICTS[v.district]+'</p><p class="victorquote">Sobreviveu à arena com '+v.kills+' abate(s)! A verdadeira essência do Capitólio pulsa em suas veias após demonstrar instinto supremo e tática perfeita.</p>'+escFin+'<button class="btnrestart" onclick="restartGame()">Gerar Novo Ano de Simulação</button></div>';
}

function restartGame(){
  document.getElementById('s-sim').style.display='none';
  document.getElementById('s-reaping').style.display='block';
  initTributes(); renderReaping();
}

initTributes();
renderReaping();
</script>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>* O Cowboy do Mal *</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
body{
background:#000;display:flex;flex-direction:column;
align-items:center;justify-content:center;
height:100vh;overflow:hidden;
font-family:'Press Start 2P',monospace;
color:#fff;user-select:none;
}

/* ── LOADING ── */
#loading-screen{
position:fixed;inset:0;background:#000;
display:flex;flex-direction:column;align-items:center;justify-content:center;
z-index:9999;gap:22px;
}
#loading-screen .title{font-size:12px;color:#fff;text-align:center;line-height:2.3;animation:blink 1.2s infinite;}
#loading-bar-wrap{width:280px;height:16px;border:3px solid #fff;background:#000; box-shadow: 0 0 10px rgba(255,255,255,0.5);}
#loading-bar{height:100%;width:0%;background:#fff;transition:width .25s;}
#loading-pct{font-size:8px;color:#777;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}

/* ── CUTSCENE ── */
#cutscene{
position:fixed;inset:0;background:#000;
display:none;flex-direction:column;align-items:center;justify-content:center;
z-index:8888;gap:22px;
}
#cs-img{max-height:260px;object-fit:contain;image-rendering:pixelated; filter: drop-shadow(0 0 15px rgba(255,255,255,0.2));}
#cs-img.float{animation:bossFloat 2.5s ease-in-out infinite;}
#cs-img.tired{animation:bossTired 3s ease-in-out infinite;}
#cs-img.geno{animation:genoGlitch .18s linear infinite;}
#cs-box{
border:3px solid #fff;padding:16px 24px;
background:#000;max-width:520px;width:90%;
min-height:66px;position:relative;cursor:pointer;
box-shadow: 0 0 15px rgba(255,255,255,0.2);
}
#cs-box::after{content:'▼';position:absolute;bottom:7px;right:11px;font-size:8px;animation:blink .6s infinite;}
#cs-box.choice-mode::after{display:none;}
#cs-box.no-arrow::after{display:none;}
#cs-text{font-size:10px;color:#fff;line-height:2.4; text-shadow: 1px 1px 0 #000; white-space:pre-line;}
#cs-choices{display:none;gap:20px;margin-top:14px;}
.cs-choice-btn{
font-family:'Press Start 2P',monospace;font-size:9px;
padding:10px 18px;border:3px solid #fff;
background:#000;color:#fff;cursor:pointer;
transition: all 0.2s;
}
.cs-choice-btn.kill{border-color:#ff4444;color:#ff4444; box-shadow: 0 0 10px rgba(255,0,0,0.3);}
.cs-choice-btn.kill:hover{background:#ff4444;color:#000; box-shadow: 0 0 20px rgba(255,0,0,0.8);}
.cs-choice-btn.spare{border-color:#44ff88;color:#44ff88; box-shadow: 0 0 10px rgba(0,255,0,0.3);}
.cs-choice-btn.spare:hover{background:#44ff88;color:#000; box-shadow: 0 0 20px rgba(0,255,0,0.8);}

/* ── GAME ── */
#game{display:none;flex-direction:column;align-items:center;}
#boss-area{
width:700px;height:255px;
display:flex;align-items:flex-end;justify-content:center;
background:#000;padding-bottom:4px;position:relative;overflow:hidden;
}
#boss-img{
max-height:245px;object-fit:contain;
image-rendering:pixelated;transition:opacity .5s ease, filter 0.3s;
filter: drop-shadow(0 0 10px rgba(255,255,255,0.1));
}
#boss-img.float{animation:bossFloat 2s ease-in-out infinite;}
#boss-img.crazy{animation:bossCrazy .11s linear infinite; filter: drop-shadow(0 0 20px rgba(255,100,0,0.5));}
#boss-img.tired{animation:bossTired 3s ease-in-out infinite; filter: grayscale(0.5);}
#boss-img.geno{animation:genoGlitch .15s linear infinite; filter: drop-shadow(0 0 25px rgba(255,0,0,0.8));}
#boss-img.geno-ultra{animation:genoUltra .07s linear infinite; filter: drop-shadow(0 0 40px rgba(255,0,0,1));}

/* Novo Efeito de Energização */
.energize-ptc {
position: absolute;
width: 6px; height: 6px;
border-radius: 50%;
pointer-events: none;
z-index: 10;
opacity: 1;
transition: transform 0.8s ease-out, opacity 0.8s ease-out;
box-shadow: 0 0 10px currentColor;
}

@keyframes bossFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes bossCrazy{
0%{transform:translateX(0) rotate(0deg)}
25%{transform:translateX(-9px) rotate(-4deg)}
75%{transform:translateX(9px) rotate(4deg)}
100%{transform:translateX(0) rotate(0deg)}
}
@keyframes bossTired{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(8px) rotate(3deg)}}
@keyframes genoGlitch{
0%{transform:translateX(0) skewX(0deg);filter:none;}
15%{transform:translateX(-4px) skewX(-3deg);filter:hue-rotate(90deg) brightness(1.5);}
30%{transform:translateX(4px) skewX(3deg);filter:hue-rotate(180deg);}
50%{transform:translateX(-2px) skewX(0deg);filter:brightness(2) saturate(3);}
70%{transform:translateX(6px) skewX(-2deg);filter:hue-rotate(270deg);}
85%{transform:translateX(0) skewX(1deg);filter:invert(.3);}
100%{transform:translateX(0) skewX(0deg);filter:none;}
}
@keyframes genoUltra{
0%{transform:translateX(0) skewX(0) scale(1);filter:none;}
10%{transform:translateX(-8px) skewX(-6deg) scale(1.05);filter:hue-rotate(45deg) brightness(3) contrast(2);}
20%{transform:translateX(8px) skewX(6deg) scale(.95);filter:hue-rotate(120deg) invert(.5);}
35%{transform:translateX(-5px) skewY(-2deg) scale(1.02);filter:hue-rotate(200deg) brightness(2);}
50%{transform:translateX(5px) skewY(2deg) scale(.98);filter:hue-rotate(300deg) saturate(5);}
65%{transform:translateX(-3px) skewX(3deg);filter:invert(.7) brightness(2);}
80%{transform:translateX(10px) skewX(-4deg);filter:hue-rotate(360deg) contrast(3);}
100%{transform:translateX(0) skewX(0) scale(1);filter:none;}
}

/* Genocide background glitch overlay */
#geno-bg{
position:absolute;inset:0;pointer-events:none;z-index:5;
display:none;overflow:hidden;
}
.geno-line{
position:absolute;left:0;right:0;height:2px;
background:rgba(255,0,0,.5);
animation:glitchLine .3s linear infinite;
}
@keyframes glitchLine{
0%{transform:translateX(0);opacity:.8;}
50%{transform:translateX(-10px);opacity:.3;}
100%{transform:translateX(5px);opacity:.8;}
}
/* ── FASE 3 ── */
#boss-img.p3fast{animation:bossCrazy .09s linear infinite; filter: drop-shadow(0 0 25px rgba(255,0,60,0.8));}
#boss-img.p3calm{animation:bossTired 2.6s ease-in-out infinite; filter: drop-shadow(0 0 12px rgba(255,255,255,0.2));}
#cs-img.dodge-anim{animation:dodgeAnim .5s ease-in-out 2;}
@keyframes dodgeAnim{
0%{transform:translateX(0) scale(1);}
20%{transform:translateX(-42px) scale(1.06) rotate(-6deg);}
40%{transform:translateX(34px) scale(.94) rotate(5deg);}
60%{transform:translateX(-16px) scale(1.02) rotate(-2deg);}
80%{transform:translateX(9px) rotate(1deg);}
100%{transform:translateX(0) rotate(0deg);}
}
#battle-dialogue{
display:none;position:absolute;top:8px;left:8px;right:8px;
border:3px solid #fff;background:rgba(0,0,0,.93);
padding:10px 14px;z-index:300;min-height:44px;
box-shadow:0 0 15px rgba(255,0,0,.35);cursor:pointer;
}
#battle-dialogue #bd-text{font-size:9px;color:#fff;line-height:2.1;text-shadow:1px 1px 0 #000;white-space:pre-line;}
#battle-dialogue::after{content:'▼';position:absolute;bottom:5px;right:9px;font-size:7px;animation:blink .6s infinite;}
#arena{
width:580px;height:340px;border:4px solid #fff;background:#000;
position:relative;margin:12px auto;overflow:hidden;flex-shrink:0;
box-shadow: inset 0 0 20px rgba(255,255,255,0.1);
transition: border-color 0.3s, box-shadow 0.3s, width 0.5s, height 0.5s;
}

/* Novo: Efeito de Modo Lento */
#arena.slow-mode {
box-shadow: inset 0 0 40px rgba(0, 150, 255, 0.35), 0 0 20px rgba(0, 150, 255, 0.4) !important;
border-color: #aaddff !important;
}

#arena.geno-arena{border-color:#ff2222;box-shadow: inset 0 0 30px rgba(255,0,0,0.2), 0 0 12px #ff0000;}
#arena.geno-ultra-arena{border-color:#ff0000;box-shadow:inset 0 0 50px rgba(255,0,0,0.4), 0 0 25px #ff0000,0 0 50px #ff440044;animation:borderPulse .2s linear infinite;}
@keyframes borderPulse{0%,100%{box-shadow:inset 0 0 50px rgba(255,0,0,0.4), 0 0 25px #ff0000}50%{box-shadow:inset 0 0 70px rgba(255,0,0,0.6), 0 0 45px #ff4400,0 0 80px #ff000044}}

/* Efeito de Rastro (Trails) */
#trail-canvas {
position: absolute;
top: 0; left: 0;
pointer-events: none;
z-index: 10;
mix-blend-mode: screen;
}

#heart{
position:absolute;width:16px;height:16px;
font-size:15px;display:flex;align-items:center;justify-content:center;
z-index:100;filter:drop-shadow(0 0 8px #ff0000);pointer-events:none;
transition: transform 0.05s linear;
color: #ff0000;
}
#heart.moving { transform: scale(0.9) rotate(5deg); }

/* ── BLASTERS ── */
.blaster-beam{
position:absolute;pointer-events:none;z-index:55;
animation: beamBlast 0.4s ease-out forwards;
}
@keyframes beamBlast {
0% { opacity: 1; transform: scaleY(1.5); }
50% { opacity: 0.8; transform: scaleY(1); }
100% { opacity: 0; transform: scaleY(0.1); }
}

.blaster-beam.normal{
background:linear-gradient(transparent 0%,#ff8800 30%,#ffff00 50%,#ff8800 70%,transparent 100%);
box-shadow:0 0 25px #ff8800,0 0 50px #ffaa0088;
}
.blaster-beam.red{
background:linear-gradient(transparent 0%,#ff0000 30%,#ff8888 50%,#ff0000 70%,transparent 100%);
box-shadow:0 0 30px #ff0000,0 0 60px #ff000088;
}
.blaster-beam.diag{
background:linear-gradient(transparent 0%,#aa00ff 30%,#ff88ff 50%,#aa00ff 70%,transparent 100%);
box-shadow:0 0 25px #aa00ff,0 0 50px #cc00ff88;
}
.blaster-warn{
position:absolute;pointer-events:none;z-index:54;
background:rgba(255,100,0,.15);border:1px dashed #ff8800;
animation: warningBlink 0.2s infinite;
}
.blaster-warn.red-warn{background:rgba(255,0,0,.2);border:1px dashed #ff0000;}
.blaster-warn.diag-warn{background:rgba(170,0,255,.15);border:1px dashed #aa00ff;}
@keyframes warningBlink { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }

/* shots */
.shot{
position:absolute;pointer-events:none;z-index:50;
transition: opacity 0.1s;
}

/* ── HUD ── */
#hud{width:100%;display:flex;align-items:center;gap:10px;padding:7px 16px 9px;border-top:3px solid #fff;}
#hud-label{font-size:8px;white-space:nowrap;flex-shrink:0; color: #fff;}
#hp-bg{flex:1;height:14px;background:#800000;border:2px solid #fff; position: relative;}
#hp-bar{height:100%;width:100%;background:#ffff00;transition:width .1s, background-color 0.2s;}
#hp-num{font-size:8px;white-space:nowrap;flex-shrink:0; color: #fff;}
#heal-row{width:100%;display:flex;align-items:center;gap:8px;padding:0 16px 8px;}
#heal-label{font-size:7px;color:#aaa;flex-shrink:0;}
.charge{width:12px;height:12px;border:2px solid #fff;border-radius:50%;background:#44ff44;transition:background .2s, box-shadow 0.2s; box-shadow: 0 0 5px #44ff44;}
.charge.used{background:#333;border-color:#555; box-shadow: none;}
#heal-key{font-size:7px;color:#777;margin-left:6px;}

@keyframes dmgFlash{0%{background:#ff0000}100%{background:#000}}
#arena.hurt{animation:dmgFlash .15s forwards;}
@keyframes healFlash{0%{background:#00ff5533}100%{background:#000}}
#arena.healed{animation:healFlash .25s forwards;}

/* ── OVERLAY ── */
#overlay{
display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:7777;
flex-direction:column;align-items:center;justify-content:center;gap:26px;
backdrop-filter: blur(3px);
}
#ov-title{font-size:24px; text-shadow: 2px 2px 0 #000;}
#ov-sub{font-size:10px;color:#ccc;line-height:2.6;text-align:center;}
#ov-btn{
font-family:'Press Start 2P',monospace;font-size:10px;
background:#000;color:#fff;border:3px solid #fff;
padding:12px 22px;cursor:pointer; transition: all 0.2s;
}
#ov-btn:hover{background:#fff;color:#000; box-shadow: 0 0 15px rgba(255,255,255,0.8);}

/* ── FX ── */
#phase-flash{position:fixed;inset:0;pointer-events:none;z-index:6000;background:#ff4400;opacity:0;transition:opacity .08s;}
#yt-player{display:none;}
#yt-geno{display:none;}
@keyframes screenShake{
0%{transform:translate(0,0)}20%{transform:translate(-7px,4px)}
40%{transform:translate(7px,-4px)}60%{transform:translate(-4px,7px)}
80%{transform:translate(4px,-2px)}100%{transform:translate(0,0)}
}
#game.shake{animation:screenShake .25s;}
@keyframes bigShake{
0%{transform:translate(0,0)}10%{transform:translate(-14px,8px)}
20%{transform:translate(14px,-8px)}30%{transform:translate(-10px,14px)}
40%{transform:translate(10px,-5px)}50%{transform:translate(-8px,10px)}
60%{transform:translate(8px,-10px)}70%{transform:translate(-6px,8px)}
80%{transform:translate(6px,-6px)}100%{transform:translate(0,0)}
}
#game.bigShake{animation:bigShake .45s;}

.heal-popup{
position:absolute;font-size:10px;color:#44ff44; text-shadow: 1px 1px 0 #000;
pointer-events:none;z-index:200; font-weight: bold;
animation:floatUp .9s ease-out forwards;
}
@keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-35px) scale(1.2)}}
@keyframes blasterPulse{0%,100%{opacity:.4}50%{opacity:1}}
</style>
</head>
<body>

<div id="loading-screen">
<div class="title">* Carregando...<br>Aguarde. *</div>
<div id="loading-bar-wrap"><div id="loading-bar"></div></div>
<div id="loading-pct">0%</div>
</div>

<div id="cutscene">
<img id="cs-img" class="float" src="https://i.imgur.com/Ukc2sd4.png" alt="boss">
<div id="cs-box">
<div id="cs-text"></div>
<div id="cs-choices">
<button class="cs-choice-btn kill" id="btn-kill" onclick="choiceKill()">★ MATAR</button>
<button class="cs-choice-btn spare" id="btn-spare" onclick="choiceSpare()">♥ POUPAR</button>
<button class="cs-choice-btn kill" id="btn-final-attack" style="display:none" onclick="choiceFinalAttack()">★ ATACAR</button>
</div>
</div>
</div>

<div id="game">
<div id="boss-area">
<div id="geno-bg"></div>
<img id="boss-img" class="float" src="https://i.imgur.com/Ukc2sd4.png" alt="boss">
</div>
<div id="battle-panel">
<div id="arena">
<canvas id="trail-canvas"></canvas>
<div id="heart">❤</div>
<div id="battle-dialogue"><div id="bd-text"></div></div>
</div>
<div id="hud">
<div id="hud-label">HP</div>
<div id="hp-bg"><div id="hp-bar"></div></div>
<div id="hp-num">200 / 200</div>
</div>
<div id="heal-row">
<div id="heal-label">[X] CURAR</div>
<div class="charge" id="c0"></div>
<div class="charge" id="c1"></div>
<div class="charge" id="c2"></div>
<div id="heal-key"></div>
</div>
</div>
</div>

<div id="overlay">
<div id="ov-title"></div>
<div id="ov-sub"></div>
<button id="ov-btn">Tentar Novamente</button>
</div>

<canvas id="fade-canvas"></canvas>
<div id="phase-flash"></div>
<div id="yt-player"></div>
<div id="yt-geno"></div>
<div id="yt-phase3"></div>

<script>
// ══════════════════════════════════════════════════════════════
// WEB AUDIO (Mantido)
// ══════════════════════════════════════════════════════════════
let AC=null;
function getAC(){if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();return AC;}
function playTone(freq,type,dur,vol=.3){
try{const ac=getAC(),o=ac.createOscillator(),g=ac.createGain();
o.type=type;o.frequency.setValueAtTime(freq,ac.currentTime);
g.gain.setValueAtTime(vol,ac.currentTime);
g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+dur);
o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+dur);}catch(e){}
}
function playNoise(dur,vol=.15,freq=800){
try{const ac=getAC(),buf=ac.createBuffer(1,ac.sampleRate*dur,ac.sampleRate);
const d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
const src=ac.createBufferSource(),filt=ac.createBiquadFilter(),g=ac.createGain();
src.buffer=buf;filt.type='bandpass';filt.frequency.value=freq;filt.Q.value=.8;
g.gain.setValueAtTime(vol,ac.currentTime);
g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+dur);
src.connect(filt);filt.connect(g);g.connect(ac.destination);
src.start();src.stop(ac.currentTime+dur);}catch(e){}
}
function sndDamage(){playNoise(.12,.4,1200);playTone(180,'sawtooth',.15,.25);}
function sndHeal(){[440,554,659,880].forEach((f,i)=>setTimeout(()=>playTone(f,'sine',.18,.22),i*55));}
function sndDeath(){playNoise(.6,.6,400);[300,220,160,100].forEach((f,i)=>setTimeout(()=>playTone(f,'sawtooth',.25,.35),i*80));}
function sndTransform(){playNoise(.35,.7,200);setTimeout(()=>{[80,120,200,340].forEach((f,i)=>setTimeout(()=>playTone(f,'square',.2,.4),i*60));},80);}
function sndTalk(){playTone(rand(200,320)|0,'square',.045,.12);}
function sndGenoTalk(){playTone(rand(80,140)|0,'sawtooth',.06,.15);}
function sndBlasterCharge(){
try{const ac=getAC(),o=ac.createOscillator(),g=ac.createGain();
o.type='sawtooth';
o.frequency.setValueAtTime(80,ac.currentTime);
o.frequency.linearRampToValueAtTime(600,ac.currentTime+1.2);
g.gain.setValueAtTime(.015,ac.currentTime);
g.gain.linearRampToValueAtTime(.12,ac.currentTime+1.0);
g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+1.4);
o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+1.5);}catch(e){}
}
function sndRedBlasterCharge(){
try{const ac=getAC(),o=ac.createOscillator(),g=ac.createGain();
o.type='square';
o.frequency.setValueAtTime(60,ac.currentTime);
o.frequency.linearRampToValueAtTime(800,ac.currentTime+2.2);
g.gain.setValueAtTime(.015,ac.currentTime);
g.gain.linearRampToValueAtTime(.12,ac.currentTime+2.0);
g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+2.5);
o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+2.6);}catch(e){}
}
function sndBlasterFire(){playNoise(.25,.18,300);playTone(120,'square',.3,.15);setTimeout(()=>playTone(60,'sawtooth',.2,.12),100);}
function sndWin(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>playTone(f,'sine',.35,.3),i*120));}
function sndKill(){playNoise(.4,.6,200);[400,300,200,100].forEach((f,i)=>setTimeout(()=>playTone(f,'sawtooth',.2,.35),i*70));}
function sndSpare(){[660,880,1100].forEach((f,i)=>setTimeout(()=>playTone(f,'sine',.3,.25),i*100));}
function sndGenoStart(){
playNoise(.5,.8,150);
[40,60,80,120,200].forEach((f,i)=>setTimeout(()=>playTone(f,'sawtooth',.3,.5),i*40));
}
function sndGenoUltra(){
for(let i=0;i<5;i++)setTimeout(()=>{playNoise(.15,.9,300);playTone(40+i*20,'square',.2,.4);},i*80);
}
function sndGenoFade(){[880,660,440,220,110].forEach((f,i)=>setTimeout(()=>playTone(f,'sine',.4,.2),i*200));}

// ══════════════════════════════════════════════════════════════
// YOUTUBE
// ══════════════════════════════════════════════════════════════
let ytPlayer=null,ytGeno=null,genoReady=false;
let ytPhase3=null,phase3Ready=false;

window.onYouTubeIframeAPIReady=function(){
ytPlayer=new YT.Player('yt-player',{
height:'1',width:'1',videoId:'7lb-EH42ZuQ',
playerVars:{autoplay:0,controls:0,modestbranding:1},
events:{onReady:onPlayerReady,onStateChange:onPlayerStateChange}
});
ytGeno=new YT.Player('yt-geno',{
height:'1',width:'1',videoId:'TtfoKaKi9P8',
playerVars:{autoplay:0,controls:0,modestbranding:1},
events:{onReady:()=>{genoReady=true;}}
});
ytPhase3=new YT.Player('yt-phase3',{
height:'1',width:'1',videoId:'naS_AkdyU5I',
playerVars:{autoplay:0,controls:0,modestbranding:1},
events:{onReady:()=>{phase3Ready=true;},onStateChange:onPhase3StateChange}
});
};

function onPhase3StateChange(e){
if(e.data===YT.PlayerState.ENDED&&phase3Started&&gamePhase==='p3'&&gameRunning){
endPhase3Battle();
}
}

function onPlayerReady(e){
e.target.mute();e.target.playVideo();
let ready=false;
let iv=setInterval(()=>{
if(!ytPlayer||!ytPlayer.getPlayerState)return;
let state=ytPlayer.getPlayerState();
let frac=ytPlayer.getVideoLoadedFraction?ytPlayer.getVideoLoadedFraction():0;
let pct=Math.round(frac*100);
document.getElementById('loading-bar').style.width=pct+'%';
document.getElementById('loading-pct').textContent=pct+'%';
if(!ready&&(state===1||state===2||pct>=15)){
ready=true;clearInterval(iv);
ytPlayer.stopVideo();ytPlayer.unMute();ytPlayer.setVolume(72);
document.getElementById('loading-screen').style.display='none';
startIntroCutscene();
}
},250);
}

function runCutscene(lines,imgSrc,imgClass,onDone,genoVoice=false){

}

function showCSLine(i){
if(i>=csLines.length){endCutscene();return;}
csIdx=i;csCharIdx=0;csTyping=true;

if(csIv)clearInterval(csIv);

csTalkIv=setInterval(()=>{if(csTyping)talkFn();},70);
csIv=setInterval(()=>{
document.getElementById('cs-text').textContent=csLines[csIdx].slice(0,csCharIdx++);
if(csCharIdx>csLines[csIdx].length){
clearInterval(csIv);clearInterval(csTalkIv);csTyping=false;
}
},36);
}
function csAdvance(){
if(csChoiceMode)return;
if(csTyping){
clearInterval(csIv);clearInterval(csTalkIv);csTyping=false;
document.getElementById('cs-text').textContent=csLines[csIdx];
}else{showCSLine(csIdx+1);}
}
function csKey(e){if(['z','Z','Enter',' '].includes(e.key))csAdvance();}
function endCutscene(){

}

// GAME LOOPS

function loop(ts){
if(!gameRunning||genoStarted)return;
let dt=Math.min(ts-lastTs,80);lastTs=ts;animFrame++;
if(ytPlayer&&ytPlayer.getCurrentTime)musicTime=ytPlayer.getCurrentTime();
phaseUpdate();
movePlayer();handleHeal(dt);
if(gamePhase!=='wait'&&gamePhase!=='tired'){
attackTimer-=dt;waveLockTimer-=dt;
if(attackTimer<=0&&waveLockTimer<=0){
spawnAttack();
let gap=crazy()?WAVE_MIN_GAP_CRAZY:WAVE_MIN_GAP_NORMAL;
attackTimer=attackInterval+rand(-200,200);
waveLockTimer=gap;
}
}
updateBullets(dt);updateBlasters(dt);
if(invincible){invincTimer-=dt;if(invincTimer<=0)invincible=false;}
render();
requestAnimationFrame(loop);
}

function phaseUpdate(){
const t=musicTime,img=document.getElementById('boss-img');
if(t>=9&&gamePhase==='wait'){
gamePhase='normal';attackInterval=2600;
img.src='https://i.imgur.com/Ukc2sd4.png';img.className='float';
}
if(t>=48&&gamePhase==='normal'){
gamePhase='crazy';attackInterval=2000;
img.src='https://i.imgur.com/hb2h3Vs.png';img.className='crazy';
sndTransform();flashPhase();shakeScreen();bullets=[];clearBlasterDom();blasters=[];
}
if(t>=124&&gamePhase==='crazy'){
gamePhase='tired';bullets=[];clearBlasterDom();blasters=[];
img.src='https://i.imgur.com/NfJOnMi.jpeg';img.className='tired';
tiredFadeStart=t;sndTransform();
document.getElementById('arena').classList.add('slow-mode');
shakeScreen();

if(window.tiredFallback) clearTimeout(window.tiredFallback);
window.tiredFallback = setTimeout(() => {
if(gamePhase==='tired' && !winTriggered && gameRunning) {
winGame();
}
}, 25000);
}
if(gamePhase==='tired'&&tiredFadeStart>0){
let fadeDuration = 22;
let elapsed = musicTime - tiredFadeStart;
let op = Math.max(0, 1 - (elapsed / fadeDuration));
img.style.opacity = op;

if(!winTriggered && op <= 0) {
winGame();
}
}
}

function genoLoop(ts){
if(!gameRunning||!genoStarted)return;

if(ytGeno&&ytGeno.getCurrentTime)genoMusicTime=ytGeno.getCurrentTime();
genoPhaseUpdate();
movePlayer();handleHeal(dt);
if(gamePhase!=='geno-tired'){
attackTimer-=dt;waveLockTimer-=dt;
if(attackTimer<=0&&waveLockTimer<=0){
spawnGenoAttack();
let gap=gamePhase==='geno-ultra'?WAVE_MIN_GAP_ULTRA:WAVE_MIN_GAP_GENO;
attackTimer=attackInterval+rand(-150,150);
waveLockTimer=gap;
}
}
updateBullets(dt);updateBlasters(dt);
if(invincible){invincTimer-=dt;if(invincTimer<=0)invincible=false;}
renderGeno();
requestAnimationFrame(genoLoop);
}

function p3SetSub(name,attacks,interval,gap,sprite){
if(phase3SubPhase===name)return;
phase3SubPhase=name;phase3AttacksOn=attacks;
if(attacks){attackTimer=0;phase3AttackInterval=interval;phase3AttackGap=gap;}

let isSlow = name.includes('slow') || name.includes('dialogue') || name.includes('frozen') || name.includes('end');
let currentSpeedMode = isSlow ? 'slow' : 'fast';
if (currentSpeedMode !== lastSpeedMode) {
    shakeScreen();
    lastSpeedMode = currentSpeedMode;
    let arena = document.getElementById('arena');
    if (isSlow) arena.classList.add('slow-mode');
    else arena.classList.remove('slow-mode');
}

const img=document.getElementById('boss-img');
img.src=sprite;
img.className=(sprite===SPRITE_FAST)?'p3fast':'p3calm';
}

function phase3PhaseUpdate(){
const t=phase3MusicTime;

// 0:32 — Primeira parte rápida
if(t >= 32 && t < 64){
p3SetSub('p3-fast1',true,1600,1500,SPRITE_FAST);
}
// 1:04 — Médio
else if(t >= 64 && t < 72){
p3SetSub('p3-medium',true,2000,1800,SPRITE_FAST);
}
// 1:12 — Rápido denovo
else if(t >= 72 && t < 80){
p3SetSub('p3-fast2',true,1400,1300,SPRITE_FAST);
}
// 1:20 — Lento
else if(t >= 80 && t < 84){
p3SetSub('p3-slow1',true,2800,2400,SPRITE_CALM);
}
// 1:24 — Rápido denovo
else if(t >= 84 && t < 116){
p3SetSub('p3-fast3',true,1100,1000,SPRITE_FAST);
}
// 1:56 — Diálogo (para ataques)
else if(t >= 116 && t < 152){
if(phase3SubPhase!=='p3-dialogue'){
p3SetSub('p3-dialogue', false, 0, 0, SPRITE_CALM);
bullets=[];clearBlasterDom();blasters=[];
showBattleDialogue(PHASE3_FLASHBACK_LINES,()=>{});
}
}
// 2:32 — Fim do diálogo, arena aumenta, rápido
else if(t >= 152 && t < 168){
if(phase3SubPhase!=='p3-fast4'){
document.getElementById('battle-dialogue').style.display='none';
AW=900;AH=520;
document.getElementById('arena').style.width='900px';
document.getElementById('arena').style.height='520px';
document.getElementById('arena').className='geno-ultra-arena';
bigShakeScreen();
}
p3SetSub('p3-fast4',true,1100,1000,SPRITE_FAST);
}
// 2:48 — Máximo: mais rápido, tremendo, cooldown baixo
else if(t >= 168 && t < 184){
p3SetSub('p3-ultra',true,700,600,SPRITE_FAST);
}
// 3:04 — Tela pisca branco, para ataques, fade out
else if(t >= 184 && t < 200){
if(phase3SubPhase!=='p3-fadeout'){
p3SetSub('p3-fadeout', false, 0, 0, SPRITE_CALM);
bullets=[];clearBlasterDom();blasters=[];
let flash=document.getElementById('phase-flash');
flash.style.background='#ffffff';
flash.style.opacity='0.9';
setTimeout(()=>{flash.style.opacity='0';}, 200);
document.getElementById('arena').className='geno-arena slow-mode';
}
// Fade out do boss
let img=document.getElementById('boss-img');
let prog = (t - 184) / 16;
if(prog >= 1) prog = 1;
img.style.opacity = 1 - prog;
}
// 3:20 — Batalha acaba
else if(t >= 200 && phase3SubPhase!=='p3-end'){
p3SetSub('p3-end',false,0,0,SPRITE_CALM);
endPhase3Battle();
}
}

function p3DamageAmt(){
if(phase3SubPhase==='p3-ultra')return 40;
if(phase3SubPhase==='p3-fast4')return 35;
if(phase3SubPhase==='p3-fast3'||phase3SubPhase==='p3-fast2'||phase3SubPhase==='p3-fast1')return 28;
if(phase3SubPhase==='p3-slow1'||phase3SubPhase==='p3-medium')return 20;
return 18;
}

function mkAimShot(x, y, w, h, spd, color, aimTime) {
    return {x, y, w, h, spd, color, type: 'aim-shot', aimTime, maxAim: aimTime, angle: 0, vx: 0, vy: 0};

function patAimBlinkShoot() {
    let count = ultra() || phase3SubPhase==='p3-ultra' || phase3SubPhase==='p3-fast4' ? 14 : (crazy() || phase3AttacksOn ? 10 : 8);
    let spd = ultra() || phase3SubPhase==='p3-ultra' ? 6.5 : (crazy() || phase3AttacksOn ? 4.5 : 3.5);
    for(let i=0; i<count; i++) {
        setTimeout(() => {
            if(!gameRunning) return;
            let edge = Math.floor(Math.random()*4);
            let x, y;
            if(edge===0) { x=rand(10,AW-10); y=-20; }
            else if(edge===1) { x=AW+20; y=rand(10,AH-10); }
            else if(edge===2) { x=rand(10,AW-10); y=AH+20; }
            else { x=-20; y=rand(10,AH-10); }
            bullets.push(mkAimShot(x, y, 14, 14, spd, ultra() ? '#ff00aa' : '#ffaa00', 800));
        }, i * 120);
    }
}

function movePlayer(){
let isMoving = false;
if(keysHeld['a']||keysHeld['A']) { px-=SPDHEART; isMoving = true; }
if(keysHeld['d']||keysHeld['D']) { px+=SPDHEART; isMoving = true; }
if(keysHeld['w']||keysHeld['W']) { py-=SPDHEART; isMoving = true; }
if(keysHeld['s']||keysHeld['S']) { py+=SPDHEART; isMoving = true; }

let heart = document.getElementById('heart');
if(isMoving) heart.classList.add('moving');
else heart.classList.remove('moving');
}

let healKeyWasUp=true;
function handleHeal(dt){
if(healCooldown>0)healCooldown-=dt;
if((keysHeld['x']||keysHeld['X'])&&healCharges>0&&healCooldown<=0&&playerHP<maxHP&&healKeyWasUp){
healKeyWasUp=false;
healCharges--;healCooldown=HEAL_CD;
playerHP=Math.min(maxHP,playerHP+HEAL_AMT);
updateHP();updateCharges();sndHeal();
let arena=document.getElementById('arena');

pop.className='heal-popup';pop.textContent='+'+HEAL_AMT;
pop.style.left=(px+2)+'px';pop.style.top=(py-10)+'px';

}

function rand(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
const crazy=()=>gamePhase==='crazy';
const geno=()=>gamePhase==='geno'||gamePhase==='geno-ultra';
const ultra=()=>gamePhase==='geno-ultra';

function mkShot(x,y,w,h,vx,vy,color,bounceV=false, homingTime=0){
return{x,y,w,h,vx,vy,color,type:'shot',bounceV, homingTime};
}

return{x,y,r,vx,vy,color,type:'ball',bounceV:false};
}

// GUN BLASTER SYSTEM
// ══════════════════════════════════════════════════════════════
const BLASTER_CHARGE_NORMAL=1000;
const BLASTER_CHARGE_RED=1500;
const BLASTER_FIRE_NORMAL=400;
const BLASTER_FIRE_RED=1200;

function spawnGunBlaster(variant, customX=-1, customY=-1){
let chargeTime=variant.startsWith('red')?BLASTER_CHARGE_RED:BLASTER_CHARGE_NORMAL;
let fireTime=variant.startsWith('red')?BLASTER_FIRE_RED:BLASTER_FIRE_NORMAL;
const isRed=variant.startsWith('red');
const isDiag=variant.startsWith('diag');
const arena=document.getElementById('arena');

let warnEl=document.createElement('div');
let beamEl=document.createElement('div');

if(isDiag){
let angle=rand(25,65)*(Math.random()>.5?1:-1);
let cx=customX !== -1 ? customX : rand(AW*.1,AW*.9);
let cy=customY !== -1 ? customY : rand(AH*.1,AH*.9);
let len=Math.sqrt(AW*AW+AH*AH)*1.5;
let beamH=18;

warnEl.className='blaster-warn diag-warn';
let warnLen=len;
warnEl.style.cssText=`left:${cx-warnLen/2}px;top:${cy-3}px;width:${warnLen}px;height:6px;`+
`transform:rotate(${angle}deg);transform-origin:50% 50%;`;

beamEl.className='blaster-beam diag';
beamEl.style.cssText=`left:${cx-len/2}px;top:${cy-beamH/2}px;`+
`width:${len}px;height:${beamH}px;`+
`transform:rotate(${angle}deg);transform-origin:50% 50%;display:none;`;

arena.appendChild(warnEl);arena.appendChild(beamEl);
if(isRed)sndRedBlasterCharge();else sndBlasterCharge();

blasters.push({
type:'diag',angle,cx,cy,len,beamH,
beamX:cx-len/2,beamY:cy-beamH/2,beamW:len,bH:beamH,angleRad:angle*Math.PI/180,
timer:chargeTime,fireTimer:fireTime,state:'charge',
beamEl,warnEl,isRed
});
return;
}

let dir=variant==='red-v'?'v':variant==='red-h'?'h':variant;
let beamW,beamH,warnX,warnY,warnW,warnH,beamX,beamY;
if(dir==='h'){
let y=customY !== -1 ? customY : rand(20,AH-50);
beamW=AW+20;beamH=22;
warnX=0;warnY=y+4;warnW=AW;warnH=14;
beamX=0;beamY=warnY;
}else{
let x=customX !== -1 ? customX : rand(20,AW-50);
beamW=22;beamH=AH+20;
warnX=x+4;warnY=0;warnW=14;warnH=AH;
beamX=warnX;beamY=0;
}

let warnClass='blaster-warn'+(isRed?' red-warn':'');
let beamClass='blaster-beam '+(isRed?'red':'normal');

warnEl.className=warnClass;
warnEl.style.cssText=`left:${warnX}px;top:${warnY}px;width:${warnW}px;height:${warnH}px;`;
beamEl.className=beamClass;
beamEl.style.cssText=`left:${beamX}px;top:${beamY}px;width:${beamW}px;height:${beamH}px;display:none;`;

arena.appendChild(warnEl);arena.appendChild(beamEl);
if(isRed)sndRedBlasterCharge();else sndBlasterCharge();

blasters.push({
type:'straight',dir,
beamX,beamY,beamW,beamH:beamH,
timer:chargeTime,fireTimer:fireTime,state:'charge',
beamEl,warnEl,isRed
});
}

function updateBlasters(dt){
for(let i=blasters.length-1;i>=0;i--){
let b=blasters[i];
b.timer-=dt;
if(b.state==='charge'&&b.timer<=0){
b.state='fire';b.timer=b.fireTimer;
if(b.warnEl&&b.warnEl.parentNode)b.warnEl.remove();
b.beamEl.style.display='block';
sndBlasterFire();shakeScreen();
let arena=document.getElementById('arena');
arena.classList.remove('healed');
}else if(b.state==='fire'){
if(!invincible){
let hcx=px+HW/2,hcy=py+HH/2;
if(b.type==='diag'){
let dx=hcx-b.cx,dy=hcy-b.cy;
let cos=Math.cos(-b.angleRad),sin=Math.sin(-b.angleRad);
let rx=dx*cos-dy*sin,ry=dx*sin+dy*cos;
if(Math.abs(ry)<b.bH/2+5&&Math.abs(rx)<b.len/2){
takeDamage(b.isRed?35:22);
}
}else{
if(hcx>b.beamX&&hcx<b.beamX+b.beamW&&hcy>b.beamY&&hcy<b.beamY+b.beamH){
takeDamage(b.isRed?35:22);
}
}
}
if(b.timer<=0){
if(b.beamEl) {
    b.beamEl.style.opacity = '0';
    setTimeout(()=>b.beamEl.remove(), 400);
}
if(b.warnEl&&b.warnEl.parentNode)b.warnEl.remove();
blasters.splice(i,1);
}
}
}
}

function clearBlasterDom(){
blasters.forEach(b=>{
if(b.beamEl&&b.beamEl.parentNode)b.beamEl.remove();
if(b.warnEl&&b.warnEl.parentNode)b.warnEl.remove();
});
blasters=[];
}

// ========== PADRÕES ORIGINAIS ==========
function patSineWaves() {
    let count = crazy() ? 20 : 15;
    let spd = crazy() ? 3.5 : 2.5;
    let startY = rand(50, AH-50);
    for(let i=0; i<count; i++) {
        setTimeout(()=>{
            if(!gameRunning) return;
            let py1 = startY + Math.sin(i*0.5) * 80;
            let py2 = startY + Math.sin(i*0.5 + Math.PI) * 80;
            bullets.push(mkShot(-20, py1, 10, 10, spd, 0, '#44aaff'));
            bullets.push(mkShot(AW+20, py2, 10, 10, -spd, 0, '#ff44aa'));
        }, i*150);
    }
}

function patClosingGaps() {
    let waves = crazy() ? 4 : 3;
    let spd = crazy() ? 3 : 2.2;
    for(let w=0; w<waves; w++) {
        setTimeout(()=>{
            if(!gameRunning) return;
            let gapY = py + rand(-30, 30);
            gapY = clamp(gapY, 40, AH-40);
            for(let y=0; y<AH; y+=20) {
                if(Math.abs(y - gapY) < (crazy()?35:45)) continue;
                let fromLeft = w%2===0;
                bullets.push(mkShot(fromLeft ? -20 : AW+20, y, 15, 6, fromLeft?spd:-spd, 0, '#fff'));
            }
        }, w*800);
    }
}

function patTargetedLines() {
    let lines = crazy() ? 5 : 3;
    let spd = crazy() ? 4 : 3;
    for(let i=0; i<lines; i++) {
        setTimeout(()=>{
            if(!gameRunning) return;
            let hcx = px + HW/2, hcy = py + HH/2;
            let dx = hcx - AW/2, dy = hcy - AH/2;
            let dist = Math.sqrt(dx*dx+dy*dy) || 1;
            let vx = (dx/dist)*spd, vy = (dy/dist)*spd;
            for(let j=0; j<4; j++) {
                setTimeout(()=>{
                    bullets.push(mkShot(AW/2, AH/2, 8, 8, vx, vy, '#ffdd00'));
                }, j*80);
            }
        }, i*600);
    }
}

function patGridBlasters() {
    let safeCol = Math.floor(rand(0, 3));
    let safeRow = Math.floor(rand(0, 3));
    let colW = AW/3;
    let rowH = AH/3;
    for(let i=0; i<3; i++) {
        if(i !== safeCol) {
            spawnGunBlaster('v', colW * i + colW/2, -1);
        }
        if(i !== safeRow) {
            spawnGunBlaster('h', -1, rowH * i + rowH/2);
        }
    }
}

function patBlasterSweep() {
    let count = crazy() || geno() ? 5 : 4;
    let isV = Math.random() > 0.5;
    let step = (isV ? AW : AH) / count;
    for(let i=0; i<count; i++) {
        setTimeout(()=>{
            if(!gameRunning) return;

// ══════════════════════════════════════════════════════════════
// UPDATE BULLETS
// ══════════════════════════════════════════════════════════════
function updateBullets(dt){
const mul=dt/16,hcx=px+HW/2,hcy=py+HH/2,hitR=5;
for(let i=bullets.length-1;i>=0;i--){
let b=bullets[i];

if(b.type === 'aim-shot') {
    if(b.aimTime > 0) {
        b.aimTime -= dt;
        b.angle = Math.atan2(hcy - (b.y+b.h/2), hcx - (b.x+b.w/2));
        b.blink = (Math.floor(b.aimTime / 80) % 2 === 0);
        if(b.aimTime <= 0) {
            b.vx = Math.cos(b.angle) * b.spd;
            b.vy = Math.sin(b.angle) * b.spd;
            b.type = 'shot';
            b.blink = false;
        } else {
            continue;
        }
    }
}

if(b.homingTime && b.homingTime > 0) {
    b.homingTime -= dt;
    let dx = hcx - b.x;
    let dy = hcy - b.y;
    let dist = Math.sqrt(dx*dx+dy*dy) || 1;
    let speed = Math.sqrt(b.vx*b.vx + b.vy*b.vy);
    b.vx = b.vx * 0.9 + (dx/dist)*speed * 0.1;
    b.vy = b.vy * 0.9 + (dy/dist)*speed * 0.1;
}

if(b.p3fake){
    b.p3fakeTimer=(b.p3fakeTimer||0)+dt;
    if(b.p3fakeTimer>420){bullets.splice(i,1);continue;}
}
if(b.p3trap){
    b.p3trapTimer-=dt;
    if(b.p3trapTimer<=0){
        b.p3trap=false;b.color='#ff2222';
        b.vx*=1.9;b.vy*=1.9;
    }
}
if(b.p3split){
    b.p3splitTimer-=dt;
    if(b.p3splitTimer<=0){
        b.p3split=false;
        let baseA=Math.atan2(b.vy,b.vx),spd=Math.sqrt(b.vx*b.vx+b.vy*b.vy);
        [-0.5,0,0.5].forEach(off=>{
            let a=baseA+off;
            bullets.push(mkShot(b.x,b.y,10,10,Math.cos(a)*spd,Math.sin(a)*spd,'#ff0066'));
        });
        bullets.splice(i,1);continue;
    }
}

b.x+=b.vx*mul;b.y+=b.vy*mul;
if(b.bounceV){
let bh=b.h||b.r*2||10;
if(b.y<0){b.y=0;b.vy=Math.abs(b.vy);}
if(b.y>AH-bh){b.y=AH-bh;b.vy=-Math.abs(b.vy);}
}
const m=80;
if(b.x<-m||b.x>AW+m||b.y<-m||b.y>AH+m){bullets.splice(i,1);continue;}

if(!invincible){
let hit=false;
if(b.type==='ball'){let dx=hcx-(b.x+b.r),dy=hcy-(b.y+b.r);hit=Math.sqrt(dx*dx+dy*dy)<b.r+hitR;}
else{
    let bCx = b.x + b.w/2, bCy = b.y + b.h/2;
    let r1 = Math.min(b.w, b.h)/2;
    let dx = hcx - bCx, dy = hcy - bCy;
    hit = Math.sqrt(dx*dx+dy*dy) < (r1 + hitR - 2);
}
if(hit){
    let isMoving = keysHeld['w'] || keysHeld['W'] || 
                   keysHeld['a'] || keysHeld['A'] || 
                   keysHeld['s'] || keysHeld['S'] || 
                   keysHeld['d'] || keysHeld['D'];
    if(b.isBlue && !isMoving) {
        // fica imune
    } else if (b.type === 'heal') {
        playerHP = Math.min(maxHP, playerHP + 50);
        updateHP(); sndHeal();
        let arena=document.getElementById('arena');
        let pop=document.createElement('div');
        pop.className='heal-popup';pop.textContent='+50';
        pop.style.left=(px+2)+'px';pop.style.top=(py-10)+'px';
        arena.appendChild(pop);setTimeout(()=>pop.remove(),900);
        arena.classList.remove('healed');void arena.offsetWidth;arena.classList.add('healed');
        bullets.splice(i, 1);
    } else {
        takeDamage(gamePhase==='p3' ? p3DamageAmt() : (geno() ? 25 : crazy() ? 18 : 12));
        bullets.splice(i, 1);
    }
}
}
}
}

// ══════════════════════════════════════════════════════════════
// DAMAGE / HP
// ══════════════════════════════════════════════════════════════
function takeDamage(amt){
if(invincible)return;
playerHP=Math.max(0,playerHP-amt);
invincible=true;invincTimer=800;
updateHP();sndDamage();
let a=document.getElementById('arena');
a.classList.remove('hurt');void a.offsetWidth;a.classList.add('hurt');
shakeScreen();
if(playerHP<=0)gameOver();
}
function updateHP(){
let pct=(playerHP/maxHP)*100;
document.getElementById('hp-bar').style.width=pct+'%';
document.getElementById('hp-num').textContent=playerHP+' / '+maxHP;
document.getElementById('hp-bar').style.background=pct>50?'#ffff00':pct>25?'#ff8800':'#ff0000';
}

// ══════════════════════════════════════════════════════════════
// RENDER (Com Trails Canvas)
// ══════════════════════════════════════════════════════════════
function render(){ updateTrailCanvas(); renderBullets(); }
function renderGeno(){ updateTrailCanvas(); renderBullets(); }

function updateTrailCanvas() {
let tc = document.getElementById('trail-canvas');
if(!tc) return;
let arena = document.getElementById('arena');
if(tc.width !== arena.clientWidth || tc.height !== arena.clientHeight) {
    tc.width = arena.clientWidth;
    tc.height = arena.clientHeight;
}
let ctx = tc.getContext('2d');
ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
ctx.fillRect(0, 0, tc.width, tc.height);

for(let b of bullets) {
    if(b.type === 'aim-shot' && b.aimTime > 0) continue;
    if(b.isGreenHeart) continue;
    
    ctx.fillStyle = b.color;
    ctx.beginPath();
    ctx.arc(b.x + b.w/2, b.y + b.h/2, (b.w/2)*0.85, 0, Math.PI*2);
    ctx.fill();
}
}

function renderBullets(){
const heart=document.getElementById('heart');
heart.style.left=px+'px';heart.style.top=py+'px';
heart.style.opacity=(invincible&&Math.floor(invincTimer/80)%2===0)?'0.12':'1';
const arena=document.getElementById('arena');
arena.querySelectorAll('.shot-el').forEach(e=>e.remove());
for(let b of bullets){
let el=document.createElement('div');
el.className='shot shot-el';

if(b.isGreenHeart) {
    el.innerHTML = '💚';
    el.style.cssText = `left:${b.x}px;top:${b.y}px;width:${b.w}px;height:${b.h}px;font-size:16px;display:flex;align-items:center;justify-content:center;background:transparent;box-shadow:none;text-shadow:0 0 10px #00ff00;`;
}
else if(b.type==='ball'){
let d=b.r*2;
el.style.cssText=`left:${b.x}px;top:${b.y}px;width:${d}px;height:${d}px;`+
`background:${b.color};box-shadow:0 0 10px ${b.color};border-radius:50%;`;
}else{
let angle = b.type === 'aim-shot' ? b.angle : Math.atan2(b.vy,b.vx);
let degAngle = angle*180/Math.PI;
el.style.cssText=
`left:${b.x}px;top:${b.y}px;width:${b.w}px;height:${b.h}px;`+
`background:${b.color};`+
`box-shadow:0 0 8px ${b.color},inset 0 0 4px #fff;`+
`transform-origin:center center;`+
`transform:rotate(${degAngle}deg);`+
`border-radius:${Math.min(b.w,b.h)/2}px;`;

if(b.blink) {
    el.style.opacity = '0.35';
    el.style.boxShadow = `0 0 25px ${b.color}, inset 0 0 10px #fff`;
}
}
arena.appendChild(el);
}
}

if(ytPlayer)ytPlayer.stopVideo();

bullets=[];clearBlasterDom();
if(ytPhase3&&ytPhase3.stopVideo)ytPhase3.stopVideo();

sndDeath();
let isGeno=genoStarted;
let isP3=gamePhase==='p3'||gamePhase==='p3-intro';
document.getElementById('ov-title').textContent='* VOCÊ MORREU *';
document.getElementById('ov-title').style.color='#ff4444';
document.getElementById('ov-sub').innerHTML= isP3
? 'WOODY: "Eu avisei... de novo, e de novo."<br>"Volte quando estiver pronto pra valer."<br><br>* Tente de novo. *'
: isGeno
? 'WOODY: "Era inevitável, parceiro."<br>"A Rota Genocida tem um preço que ninguém escapa."<br><br>* Tente de novo. *'
: 'WOODY: "Pensei que fosse mais do que isso."<br>"Mas tudo bem. Fique aqui com os outros que falharam."<br><br>* Mantenha a Determinação. *';

}

function winGame(){
if(!gameRunning||winTriggered)return;
winTriggered=true;gameRunning=false;
bullets=[];clearBlasterDom();
if(ytPlayer)ytPlayer.stopVideo();
startWinCutscene();
}

function resetGame(){
document.getElementById('overlay').style.display='none';
document.getElementById('game').style.display='none';
document.getElementById('cutscene').style.display='none';
document.getElementById('cs-img').style.opacity='1';
document.getElementById('arena').className='';
document.getElementById('geno-bg').style.display='none';

if(tc && tc.getContext) tc.getContext('2d').clearRect(0,0,tc.width,tc.height);
if(glitchIv){clearInterval(glitchIv);glitchIv=null;}
bullets=[];blasters=[];keysHeld={};
gamePhase='wait';animFrame=0;attackTimer=0;waveLockTimer=0;
maxHP=MAX_HP;playerHP=MAX_HP;healCharges=3;healCooldown=0;healKeyWasUp=true;
invincible=false;tiredFadeStart=-1;winTriggered=false;genoStarted=false;
genoMusicTime=0;musicTime=0;
genoAttacksStarted=false;
phase3Started=false;phase3MusicTime=0;phase3SubPhase='none';phase3AttacksOn=false;
lastSpeedMode = 'fast';
p3EnergizeStarted = false;

document.getElementById('btn-final-attack').style.display='none';
document.getElementById('btn-kill').style.display='';
document.getElementById('btn-spare').style.display='';
document.getElementById('boss-img').style.opacity='1';
document.getElementById('boss-img').style.filter='';
AW=572;AH=332;
document.getElementById('arena').style.width='580px';
document.getElementById('arena').style.height='340px';
if(ytGeno)ytGeno.stopVideo();
if(ytPhase3&&ytPhase3.stopVideo)ytPhase3.stopVideo();

}
